  {en:{q:"What's the difference between lockout and tagout?",a:"Lockout: an energy-isolating device (like a breaker) is placed in the Off position and physically locked. Tagout: components are set to a safe position and a written warning tag is attached — used when a device can't be physically locked."}, es:{q:"¿Cuál es la diferencia entre bloqueo (lockout) y etiquetado (tagout)?",a:"Bloqueo: un dispositivo aislante de energía (como un disyuntor) se pone en apagado y se bloquea físicamente. Etiquetado: los componentes se ponen en posición segura y se coloca una etiqueta de advertencia escrita, usado cuando un dispositivo no puede bloquearse físicamente."}},
  {en:{q:"List the PPE items commonly worn by craftworkers on a job site.",a:"Hard hats, eye and face protection, gloves, foot and leg protection, hearing protection, respiratory protection, and high-visibility clothing."}, es:{q:"Enumera los artículos de EPP que usan comúnmente los trabajadores de la construcción.",a:"Cascos, protección ocular y facial, guantes, protección de pies y piernas, protección auditiva, protección respiratoria y ropa de alta visibilidad."}},
  {en:{q:"What is silicosis and what causes it?",a:"An incurable, sometimes fatal lung disease caused by inhaling crystalline silica dust — created when cutting, drilling, or grinding concrete, masonry, or rock."}, es:{q:"¿Qué es la silicosis y qué la causa?",a:"Una enfermedad pulmonar incurable, a veces mortal, causada por inhalar polvo de sílice cristalina; se genera al cortar, taladrar o pulir concreto, mampostería o roca."}},
  {en:{q:"Name the four general types of respirators.",a:"Self-contained breathing apparatus (SCBA), supplied air mask, full facepiece mask with chemical canister (gas mask), and half mask/mouthpiece with mechanical filter."}, es:{q:"Nombra los cuatro tipos generales de respiradores.",a:"Aparato de respiración autónomo (SCBA), máscara de aire suministrado, máscara de careta completa con cartucho químico (máscara de gas), y media máscara/boquilla con filtro mecánico."}},
  {en:{q:"What are the three routes by which a worker can be exposed to hazardous materials?",a:"Inhalation (breathing), ingestion (eating/drinking), and absorption (skin contact)."}, es:{q:"¿Cuáles son las tres vías por las que un trabajador puede exponerse a materiales peligrosos?",a:"Inhalación (respirar), ingestión (comer/beber) y absorción (contacto con la piel)."}},
  {en:{q:"What's the difference between heat exhaustion and heat stroke?",a:"Heat exhaustion: cool/pale/moist skin, heavy sweating, dizziness — get to shade, cool the person down. Heat stroke: life-threatening, sweating STOPS, hot/dry skin, mental confusion — call emergency services immediately."}, es:{q:"¿Cuál es la diferencia entre agotamiento por calor y golpe de calor?",a:"Agotamiento por calor: piel fría/pálida/húmeda, sudoración intensa, mareo; llevar a la sombra y enfriar. Golpe de calor: mortal, la sudoración SE DETIENE, piel caliente/seca, confusión mental; llamar a emergencias de inmediato."}},
  {en:{q:"What's the fire triangle, and how do you put out a fire using it?",a:"Fuel + heat + oxygen, all needed in the same place at the same time. Remove any ONE of the three (fuel, heat, or oxygen) and the fire goes out."}, es:{q:"¿Qué es el triángulo del fuego, y cómo se apaga un fuego usándolo?",a:"Combustible + calor + oxígeno, los tres necesarios en el mismo lugar al mismo tiempo. Elimina CUALQUIERA de los tres (combustible, calor u oxígeno) y el fuego se apaga."}},
  {en:{q:"What do the fire extinguisher classes A, B, C, and D each fight?",a:"A: ordinary combustibles (wood, paper, cloth). B: flammable liquids (oil, gasoline, grease). C: electrical equipment. D: combustible metals (magnesium, sodium, titanium)."}, es:{q:"¿Qué combate cada clase de extintor A, B, C y D?",a:"A: combustibles ordinarios (madera, papel, tela). B: líquidos inflamables (aceite, gasolina, grasa). C: equipo eléctrico. D: metales combustibles (magnesio, sodio, titanio)."}},
  {en:{q:"What does the PASS method stand for, for using a fire extinguisher?",a:"Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side."}, es:{q:"¿Qué significa el método PASS para usar un extintor?",a:"Pull (Jalar) el pasador, Aim (Apuntar) a la base del fuego, Squeeze (Apretar) la palanca, Sweep (Barrer) de lado a lado."}},
  {en:{q:"What three OSHA criteria define a confined space?",a:"Large enough to bodily enter and work in; has limited or restricted means of entry/exit; is not designed for continuous employee occupancy."}, es:{q:"¿Qué tres criterios de OSHA definen un espacio confinado?",a:"Suficientemente grande para entrar y trabajar en él; tiene medios de entrada/salida limitados o restringidos; no está diseñado para ocupación continua de empleados."}},
  {en:{q:"What makes a confined space a 'permit-required' confined space?",a:"It has one or more added hazards: a hazardous atmosphere, material that could engulf an entrant, an internal shape that could trap/asphyxiate someone, or another serious safety/health hazard."}, es:{q:"¿Qué hace que un espacio confinado sea un espacio 'que requiere permiso'?",a:"Tiene uno o más riesgos adicionales: una atmósfera peligrosa, material que podría envolver a quien entra, una forma interna que podría atrapar/asfixiar a alguien, u otro riesgo grave de seguridad o salud."}},
  {en:{q:"What is a hot work permit, and what is a fire watch?",a:"A hot work permit is official authorization for work that may pose a fire hazard (welding, cutting). A fire watch is a dedicated person, other than the operator, who constantly scans for fires during and after hot work."}, es:{q:"¿Qué es un permiso de trabajo en caliente, y qué es una vigilancia de incendio?",a:"Un permiso de trabajo en caliente es autorización oficial para trabajo que puede causar riesgo de incendio (soldar, cortar). Una vigilancia de incendio es una persona dedicada, distinta del operador, que vigila constantemente por incendios durante y después del trabajo en caliente."}}

  {en:{q:"What are the four writing tips this module recommends for job-site writing?",a:"Be clear, be concise, be correct, and be complete."}, es:{q:"¿Cuáles son los cuatro consejos de escritura que recomienda este módulo para el sitio de trabajo?",a:"Ser claro, ser conciso, ser correcto y ser completo."}},

/* ---- missed-question tracking (simple spaced repetition) ---- */
function missedKey(item){ return item && item.en ? (item.en.q || item.en.prompt) : null; }
function addMissed(item){
  const k = missedKey(item); if(!k) return;
  if(!missed.find(x=>x.key===k)) missed.push({key:k, item});
}
function removeMissed(item){
  const k = missedKey(item); if(!k) return;
  missed = missed.filter(x=>x.key!==k);
}

/* ---- adaptive spaced repetition (lightweight SM-2-style) ----
   Every question answered anywhere (section, test, quick review, missed
   review, mixed review) updates a per-question record: ease, interval
   (days), and a due date. Get it right and the interval grows (so it comes
   back less often); get it wrong and it resets to "due tomorrow." This is
   what actually drives long-term retention — plain calendar reminders just
   say "review by this date," they don't know which specific questions a
   student has actually locked in versus which ones keep tripping them up. */
let srs = JSON.parse(localStorage.getItem('ncc_srs') || '{}'); // key -> {ease, interval, reps, lapses, due}
function saveSRS(){ localStorage.setItem('ncc_srs', JSON.stringify(srs)); }
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function updateSRS(item, correct){
  const k = missedKey(item); if(!k) return;
  const today = todayStr();
  let rec = srs[k] || { ease:2.3, interval:0, reps:0, lapses:0, due:today };
  if(correct){
    rec.reps++;
    if(rec.reps===1) rec.interval = 1;
    else if(rec.reps===2) rec.interval = 3;
    else rec.interval = Math.max(1, Math.round(rec.interval * rec.ease));
    rec.ease = Math.min(2.6, rec.ease + 0.05);
  } else {
    rec.reps = 0;
    rec.lapses = (rec.lapses||0) + 1;
    rec.ease = Math.max(1.3, rec.ease - 0.2);
    rec.interval = 1;
  }
  rec.due = addDays(today, rec.interval);
  srs[k] = rec;
  saveSRS();
}
// Reverse index of every real (non-comingSoon) question across every module, keyed the
// same way missedKey/SRS records are, so a due key can be turned back into a full item.
function buildAllQuestionIndex(){
  const idx = {};
  MODULES.forEach(m=>{
    if(m.comingSoon) return;
    (m.sections||[]).forEach(s=> (s.bank||[]).forEach(q=>{ const k=missedKey(q); if(k) idx[k]=q; }));
    (m.moduleTest||[]).forEach(q=>{ const k=missedKey(q); if(k) idx[k]=q; });
  });
  return idx;
}
const ALL_Q_INDEX = buildAllQuestionIndex();
function getDueBank(){
  const today = todayStr();
  return Object.keys(srs)
    .filter(k => srs[k].due <= today && ALL_Q_INDEX[k])
    .map(k => ALL_Q_INDEX[k]);
}
function getDueCount(){ return getDueBank().length; }
// The "mixed review" a student is nudged toward: every due question, topped up with a
// random sample of already-seen-but-not-yet-due questions so the session is never tiny
// and still deliberately interleaves material from different modules/sections together.
function buildMixedReviewBank(minSize){
  const due = getDueBank();
  if(due.length >= minSize) return shuffleArray(due);
  const dueKeys = new Set(due.map(q=>missedKey(q)));
  const seenKeys = new Set(Object.keys(srs));
  const topUpPool = Object.keys(ALL_Q_INDEX)
    .filter(k => seenKeys.has(k) && !dueKeys.has(k))
    .map(k => ALL_Q_INDEX[k]);
  const topUp = shuffleArray(topUpPool).slice(0, minSize - due.length);
  return shuffleArray(due.concat(topUp));
}

/* ---- quick review: random mixed pull from everything built so far ---- */
// Fisher-Yates shuffle — always returns a NEW array so the original question
// bank (shared, reused across quiz attempts) is never mutated in place.
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---- module dates + "add to calendar" (.ics) ---- */
const STUDY_TOOL_URL = 'https://lawrencetotimeh.com/nccer-core-study/';
// Parse a plain "YYYY-MM-DD" as LOCAL midnight (not UTC) so the displayed/compared
// date never shifts a day off in negative-UTC-offset timezones.
function parseISODate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatDisplayDate(iso){
  return parseISODate(iso).toLocaleDateString(lang==='es'?'es-ES':'en-US', {month:'short', day:'numeric', year:'numeric'});
}
function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = parseISODate(iso);
  return Math.round((target - today) / 86400000);
}
// ICS date format for an all-day VALUE=DATE event: YYYYMMDD, computed from the
// local-midnight parse above (not toISOString, which can shift a day via UTC).
function icsDate(dateObj){
  const y=dateObj.getFullYear(), m=String(dateObj.getMonth()+1).padStart(2,'0'), d=String(dateObj.getDate()).padStart(2,'0');
  return `${y}${m}${d}`;
}
function icsDatePlusDays(iso, days){
  const d = parseISODate(iso); d.setDate(d.getDate()+days); return d;
}
function escapeICSText(s){
  return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
// Rough "how long will this take" estimate so a reminder can tell someone what
// they're actually signing up for, not just "go study." Not scientific — just
// (question count * a bit) + (flashcard count * a bit) + a flat orientation
// buffer, rounded to a friendly number. Returns null for not-yet-built modules
// (no sections/test/cards to count yet).
function estimateStudyMinutes(m){
  const sections = m.sections || [];
  const qCount = sections.reduce((sum,s)=> sum + (s.bank ? s.bank.length : 0), 0) + (m.moduleTest ? m.moduleTest.length : 0);
  const cardCount = m.cards ? m.cards.length : 0;
  if(qCount === 0 && cardCount === 0) return null;
  let mins = Math.round((qCount*1.2 + cardCount*0.5) / 5) * 5;
  mins += 15;
  return Math.max(20, mins);
}
// All-day event (module start / test day) — DTEND is the next day per the
// iCalendar spec for VALUE=DATE all-day events (end date is exclusive).
function icsEvent({summary, description, dateObj}){
  const dt = icsDate(dateObj);
  const endObj = new Date(dateObj); endObj.setDate(endObj.getDate()+1);
  const uid = `${dt}-${Math.random().toString(36).slice(2)}@nccer-core-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${icsDate(endObj)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT9H',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}
// Timed study-reminder event, at the person's chosen time of day, 45 minutes
// long. Deliberately "floating" local time (no Z / TZID) so whatever device
// this gets opened on shows it at that clock time on that device — the
// simplest correct behavior for a personal study reminder.
function icsTimedEvent({summary, description, dateObj, timeStr, durationMinutes}){
  const [hh,mm] = timeStr.split(':').map(Number);
  const start = new Date(dateObj); start.setHours(hh, mm, 0, 0);
  const end = new Date(start); end.setMinutes(end.getMinutes() + (durationMinutes||45));
  const fmt = (d)=> `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const uid = `${fmt(start)}-${Math.random().toString(36).slice(2)}@nccer-core-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(start)}`,
    `DTEND:${fmt(end)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT15M',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}

/* ---- study time preferences (saved once, reused for every module) ---- */
const STUDY_PREF_KEY = 'nccer_study_prefs';
function getStudyPrefs(){
  try{ const raw = localStorage.getItem(STUDY_PREF_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveStudyPrefs(prefs){ localStorage.setItem(STUDY_PREF_KEY, JSON.stringify(prefs)); }
// Spaced (recommended): reminders 7, 3, and 1 day before the test — distributed
// practice beats one cram session for actually remembering the material.
// Single: one reminder 3 days out, for anyone who'd rather keep it simple.
const CADENCE_OFFSETS = { spaced:[-7,-3,-1], single:[-3] };

// Builds one .ics file per module: the module's start date (all-day), one or
// more timed study reminders leading up to the test (per the saved cadence
// preference, at the saved time of day), and the test day itself (all-day).
// Every description carries a link straight back to the study tool and the
// estimated time the module takes, so a reminder popping up on someone's phone
// tells them what they're actually signing up for, not just "go study."
function buildModuleICS(m, prefs){
  const events = [];
  const mins = estimateStudyMinutes(m);
  const minsNote = mins ? `\n${t('estStudyTime')(mins)}` : '';
  events.push(icsEvent({
    summary: t('icsStartSummary')(m.num),
    description: `${t('icsStartDesc')(m.title[lang])}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
    dateObj: parseISODate(m.startDate)
  }));
  if(m.examDate){
    const examDisplay = formatDisplayDate(m.examDate);
    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    const startMidnight = parseISODate(m.startDate);
    const offsets = CADENCE_OFFSETS[prefs.cadence] || CADENCE_OFFSETS.spaced;
    offsets.forEach(offset=>{
      const reminderDate = icsDatePlusDays(m.examDate, offset);
      // Skip reminders that would land before the module even starts, or in the past.
      if(reminderDate < startMidnight || reminderDate < todayMidnight) return;
      const summary = mins ? t('icsStudyReminderTitle')(m.num, mins) : t('icsStudySummary')(m.num);
      events.push(icsTimedEvent({
        summary,
        description: `${t('icsStudyDesc')(m.title[lang], examDisplay)}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
        dateObj: reminderDate,
        timeStr: prefs.time,
        durationMinutes: mins || 45
      }));
    });
    events.push(icsEvent({
      summary: t('icsExamSummary')(m.num),
      description: `${t('icsExamDesc')(m.title[lang])}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
      dateObj: parseISODate(m.examDate)
    }));
  }
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//NCCER Core Study Tool//EN',
    'CALSCALE:GREGORIAN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');
}
function triggerICSDownload(m, prefs){
  const ics = buildModuleICS(m, prefs);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `NCCER-Module-${m.num}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
// Entry point every "Add to calendar" button calls. First time ever: opens the
// one-time study-time/cadence picker, saves the answer, then downloads. Every
// time after that: prefs are already saved, so this goes straight to the
// download with zero extra clicks.
function downloadModuleICS(m){
  const prefs = getStudyPrefs();
  if(prefs){ triggerICSDownload(m, prefs); return; }
  openStudyPrefModal(()=> triggerICSDownload(m, getStudyPrefs()));
}
function buildQuickReviewBank(size){
  let pool = [];
  MODULES.forEach(m=>{
    if(m.comingSoon) return;
    m.sections.forEach(s=>{ pool = pool.concat(s.bank); });
    pool = pool.concat(m.moduleTest);
  });
  pool = shuffleArray(pool);
  return pool.slice(0, Math.min(size, pool.length));
}

/* ---- simple day streak ---- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
let streakDates = JSON.parse(localStorage.getItem('nccer_streak') || '[]');
(function recordVisitToday(){
  const today = todayStr();
  if(!streakDates.includes(today)){ streakDates.push(today); localStorage.setItem('nccer_streak', JSON.stringify(streakDates)); }
})();
function currentStreak(){
  const set = new Set(streakDates);
  let streak = 0; let d = new Date();
  while(true){
    const key = d.toISOString().slice(0,10);
    if(set.has(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

function isModuleFullyDone(i){
  const m = MODULES[i]; if(m.comingSoon) return false;
  const p = progress[m.id]; if(!p) return false;
  const secOk = m.sections.every(s => (p.sec[s.key]||0) >= 85);
  return secOk && p.testPassed;
}
function isCumulativePassed(i){ return cumulative['after_'+MODULES[i].id]?.passed === true; }
function isCumulativeAvailable(i){ return i>=1; }
// Open access: any module with real content is available immediately. The only
// thing gating a module now is whether it actually has content built yet
// (comingSoon) — no more "pass the last module first" requirement.
function isModuleUnlocked(i){
  return !MODULES[i].comingSoon;
}
function combinedTestBank(uptoIdx){
  let bank = [];
  for(let j=0;j<=uptoIdx;j++){ if(!MODULES[j].comingSoon) bank = bank.concat(MODULES[j].moduleTest); }
  return bank;
}

function startQuiz(cfg){

  // the same sequence twice — shuffleArray returns a fresh array, so the
  // module's original bank (reused across attempts) is left untouched.
  quizState = { ...cfg, bank: shuffleArray(cfg.bank), idx:0, correctCount:0, answered:false, selected:null, records:[] };
  renderQuizQuestion();
}
function startCumulativeTest(i){
  quizState = { kind:'cumulative', modIdx:i, bank: shuffleArray(combinedTestBank(i)), threshold:70, idx:0, correctCount:0, answered:false, selected:null, records:[] };
  renderQuizQuestion();

/* ===== Math Walkthrough engine (Module 00102, section type:'walkthrough') =====
   A slower, scaffolded track built for a first-time construction math learner:
   each unit steps through worked ("I do"), guided ("we do"), then a scored
   practice ("you do") question, in that order, reusing the same tape-measure
   ruler diagram throughout so the visual stays consistent while the reading
   gets harder. This intentionally does NOT reuse renderQuizQuestion/quizState
   — it's a different pedagogical mode (teach-then-check, not pure recall), so
   it gets its own small state machine that still saves into the same
   progress.sec[] bucket the rest of the app reads, so it shows up in the
   module's score grid and counts toward "fully done" exactly like any
   other section. */
function rulerSVG(maxInch, mark16){
  if(mark16===undefined || mark16===null || !maxInch) return '';
  const width=640, height=90, padding=20;
  const usable = width - 2*padding;
  const total = maxInch*16;
  const stepPx = usable/total;
  let ticks='';
  for(let s=0; s<=total; s++){
    const x = padding + s*stepPx;
    let h;
    if(s%16===0) h=36; else if(s%8===0) h=28; else if(s%4===0) h=22; else if(s%2===0) h=16; else h=10;
    ticks += `<line x1="${x.toFixed(2)}" y1="10" x2="${x.toFixed(2)}" y2="${10+h}" stroke="currentColor" stroke-width="${s%16===0?2:1}"/>`;
    if(s%16===0) ticks += `<text x="${x.toFixed(2)}" y="62" font-size="13" text-anchor="middle" fill="currentColor">${s/16}"</text>`;
  }
  const markX = padding + mark16*stepPx;
  const arrow = `<polygon points="${(markX-7).toFixed(2)},80 ${(markX+7).toFixed(2)},80 ${markX.toFixed(2)},68" fill="#e0524d"/><line x1="${markX.toFixed(2)}" y1="10" x2="${markX.toFixed(2)}" y2="68" stroke="#e0524d" stroke-width="2" stroke-dasharray="3,2"/>`;
  return `<div class="ruler-wrap"><svg viewBox="0 0 ${width} ${height}" class="ruler-svg" role="img" aria-label="Tape measure diagram with a pointer marking a measurement"><line x1="${padding}" y1="10" x2="${width-padding}" y2="10" stroke="currentColor" stroke-width="2"/>${ticks}${arrow}</svg></div>`;
}
function startWalkthrough(modIdx, section){
  walkState = { modIdx, section, unitIdx:0, stepIdx:0, selected:null, answered:false, firstTryCorrect:true, unitResults:[] };
  renderWalkthroughStep();
}
function renderWalkthroughStep(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  const units = walkState.section.units;
  const unit = units[walkState.unitIdx];
  const step = unit.steps[walkState.stepIdx];
  const it = step[lang];
  const isFirstStepOfWalkthrough = (walkState.unitIdx===0 && walkState.stepIdx===0);
  let dotsHtml = units.map((u,ui)=>{
    let cls = 'walk-dot';
    if(ui < walkState.unitIdx) cls += ' done';
    else if(ui === walkState.unitIdx) cls += ' active';
    return `<div class="${cls}"></div>`;
  }).join('');
  let body = '';
  if(isFirstStepOfWalkthrough){
    body += `<div class="walk-sub">${t('walkthroughIntro')}</div>`;
  }
  body += `<div class="walk-unit-title">${unit.title[lang]}</div>
    <div class="walk-progress">${t('walkthroughUnitOf')(walkState.unitIdx+1, units.length)}</div>
    <div class="walk-dots">${dotsHtml}</div>`;
  const roleTag = step.role==='worked' ? `<span class="walk-role-tag worked">🧑‍🏫 ${t('walkthroughRoleWorked')}</span>`
    : step.role==='guided' ? `<span class="walk-role-tag guided">🤝 ${t('walkthroughRoleGuided')}</span><div class="walk-sub">${t('walkthroughRoleGuidedSub')}</div>`
    : `<span class="walk-role-tag practice">✍️ ${t('walkthroughRolePractice')}</span><div class="walk-sub">${t('walkthroughRolePracticeSub')}</div>`;
  body += roleTag;

  if(step.role==='worked'){
    body += rulerSVG(unit.maxInch, step.mark16);
    body += `<div class="walk-text">${annotate(it.text)}</div>`;
    body += `<button class="primary" id="walkNextBtn">${t('walkthroughNextBtn')}</button>`;
    panel.innerHTML = `<div class="breadcrumb" id="walkBack">${t('backToModules')}</div>` + body;
    attachGlossaryHandlers(panel);
    document.getElementById('walkBack').onclick = ()=>{
      walkState=null; homeView=null; renderPanel();
    };
    document.getElementById('walkNextBtn').onclick = ()=> advanceWalkthroughStep();
    return;
  }

  // guided or practice: multiple choice
  if(!walkState.optPerm || walkState.optPerm.forUnit!==walkState.unitIdx || walkState.optPerm.forStep!==walkState.stepIdx){
    walkState.optPerm = { forUnit:walkState.unitIdx, forStep:walkState.stepIdx, order: shuffleArray(it.opts.map((_,i)=>i)) };
  }
  const order = walkState.optPerm.order;
  const dOpts = order.map(i=>it.opts[i]);
  const dCorrect = order.indexOf(it.c);
  body += rulerSVG(unit.maxInch, step.mark16);
  body += `<div class="walk-text" style="font-weight:600;">${annotate(it.q)}</div>`;
  let optsHtml = '';
  dOpts.forEach((opt,idx)=>{
    let cls = 'option';
    if(walkState.answered){
      if(idx===dCorrect) cls += ' correct';
      else if(idx===walkState.selected) cls += ' incorrect';
    }
    optsHtml += `<button class="${cls}" data-i="${idx}">${idx===dCorrect && walkState.answered ? '✓ ' : (idx===walkState.selected && walkState.answered ? '✗ ' : '')}${annotate(opt)}</button>`;
  });
  body += `<div id="walkOptsWrap">${optsHtml}</div>`;
  if(walkState.answered){
    const correctPick = walkState.selected === dCorrect;
    body += `<div class="walk-feedback ${correctPick?'correct':'incorrect'}">${correctPick ? '✅ '+t('walkthroughCorrect') : '❌ '+t('walkthroughIncorrect')}<br>${annotate(it.exp)}</div>`;
    if(correctPick){
      body += `<br><button class="primary" id="walkNextBtn">${t('walkthroughNextBtn')}</button>`;
    } else {
      body += `<br><button class="primary" id="walkRetryBtn">${t('walkthroughTryAgainStep')}</button>`;
    }
  }
  panel.innerHTML = `<div class="breadcrumb" id="walkBack">${t('backToModules')}</div>` + body;
  attachGlossaryHandlers(panel);
  document.getElementById('walkBack').onclick = ()=>{
    walkState=null; homeView=null; renderPanel();
  };
  if(!walkState.answered){
    panel.querySelectorAll('#walkOptsWrap .option').forEach(btn=>{
      btn.onclick = ()=>{
        walkState.selected = parseInt(btn.dataset.i);
        walkState.answered = true;
        if(step.role==='practice' && walkState.selected!==dCorrect) walkState.firstTryCorrect = false;
        renderWalkthroughStep();
      };
    });
  } else {
    const nextBtn = document.getElementById('walkNextBtn');
    if(nextBtn) nextBtn.onclick = ()=> advanceWalkthroughStep();
    const retryBtn = document.getElementById('walkRetryBtn');
    if(retryBtn) retryBtn.onclick = ()=>{
      walkState.answered = false; walkState.selected = null;
      walkState.optPerm = { forUnit:walkState.unitIdx, forStep:walkState.stepIdx, order: shuffleArray(it.opts.map((_,i)=>i)) };
      renderWalkthroughStep();
    };
  }
}
function advanceWalkthroughStep(){
  const units = walkState.section.units;
  const unit = units[walkState.unitIdx];
  if(walkState.stepIdx < unit.steps.length - 1){
    walkState.stepIdx++;
    walkState.answered = false; walkState.selected = null; walkState.optPerm = null;
    renderWalkthroughStep();
    return;
  }
  // unit finished — record whether practice was correct on the first try
  walkState.unitResults.push(walkState.firstTryCorrect);
  if(walkState.unitIdx < units.length - 1){
    walkState.unitIdx++; walkState.stepIdx = 0;
    walkState.answered = false; walkState.selected = null; walkState.optPerm = null; walkState.firstTryCorrect = true;
    renderWalkthroughStep();
  } else {
    finishWalkthrough();
  }
}
function finishWalkthrough(){
  const panel = document.getElementById('panel');
  const units = walkState.section.units;
  const passedCount = walkState.unitResults.filter(Boolean).length;
  const pct = Math.round((passedCount / units.length) * 100);
  const passed = pct >= 85;
  const p = ensureProgress(MODULES[walkState.modIdx].id);
  p.sec[walkState.section.key] = pct; saveProgress();
  const modIdx = walkState.modIdx;
  const qsForNext = { kind:'walkthrough', modIdx, section: walkState.section };
  const nextStep = getNextStep(qsForNext);
  panel.innerHTML = `
    <div class="result-big">
      <div class="result-pct ${passed?'pass':'fail'}">${pct}%</div>
      <div class="result-msg">${t('walkthroughUnitResult')(passedCount, units.length)}</div>
      <div class="result-msg" style="margin-top:8px; font-weight:600;">${passed ? t('walkthroughFinishPass') : t('walkthroughFinishRetry')}</div>
    </div>
    <button class="primary" id="walkRetakeBtn">${t('retakeBtn')}</button><br><br>
    ${nextStep ? `<button class="primary" id="walkNextPartBtn" style="background:#16a34a;">${nextStep.label}</button><br><br>` : ''}
    <button class="primary" id="walkBackHomeBtn" style="background:#475569;">${t('backHome')}</button>
  `;
  document.getElementById('walkRetakeBtn').onclick = ()=> startWalkthrough(modIdx, walkState.section);
  const nextPartBtn = document.getElementById('walkNextPartBtn');
  if(nextPartBtn) nextPartBtn.onclick = ()=>{ walkState=null; nextStep.run(); };
  document.getElementById('walkBackHomeBtn').onclick = ()=>{
    homeView = null; topTab = 'home'; walkState = null; renderTopTabs(); renderPanel();
  };
}

function showOptionDefinition(text){
  const entries = Object.keys(GLOSSARY).map(k=>({key:k, pattern: GLOSSARY[k][lang].term}));
  entries.sort((a,b)=> b.pattern.length - a.pattern.length);
  const found = entries.find(e=> new RegExp('\\b'+escapeRegExp(e.pattern)+'\\b','i').test(text));
  if(found){ openGlossary(found.key); return; }
  document.getElementById('glossTermText').textContent = '';
  document.getElementById('glossDefText').textContent = lang==='es' ? 'No hay una definición rápida para esta respuesta.' : 'No quick definition available for this answer.';
  document.getElementById('glossaryOverlay').style.display = 'flex';
}

function renderQuizQuestion(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  const fullItem = quizState.bank[quizState.idx];
  const itemType = fullItem.type || 'mc';
  // Duolingo-style mixed format: matching questions get a completely different tap-to-pair
  // UI, rendered by renderMatchQuestion. Multiple-choice and fill-in-the-blank share the same
  // data shape ({q,opts,c,exp}) and grading code below — fill-in-the-blank just renders its
  // options as word-bank chips instead of full-width stacked buttons.
  if(itemType==='match'){ renderMatchQuestion(panel, fullItem); return; }
  const item = fullItem[lang];
  // Randomize answer-option display position per question, every time it's shown — not
  // just the question order. Without this, an authored question always shows its correct
  // answer in the same slot (often first, since that's the natural order to write it in),
  // which trains guessing-the-slot instead of reading. Cached per question index so the
  // official-test flow (which re-renders on every option click to update the selection
  // highlight) doesn't reshuffle mid-question, and computed from opts.length rather than
  // per-language so switching en/es mid-quiz can't desync it (opts arrays are index-parallel
  // across languages, and `c` is the same numeric index in both).
  if(!quizState.optPerm || quizState.optPerm.forIdx !== quizState.idx){
    quizState.optPerm = { forIdx: quizState.idx, order: shuffleArray(item.opts.map((_,i)=>i)) };
  }
  const order = quizState.optPerm.order;
  const dOpts = order.map(i=>item.opts[i]);
  const dCorrect = order.indexOf(item.c);
  // The official module/cumulative test mimics a real exam: no auto-highlighted glossary
  // terms (a neutral "?" gives lookup on demand instead), you can change your pick before
  // submitting, and right/wrong isn't revealed until the full test is done.
  const isOfficialTest = (quizState.kind==='moduleTest' || quizState.kind==='cumulative');
  let optsHtml = '';
  dOpts.forEach((opt,idx)=>{
    if(isOfficialTest){
      const selCls = quizState.selected===idx ? ' selected' : '';
      optsHtml += `<button class="option${selCls}" data-i="${idx}">${opt} <span class="opt-def-btn" data-opt="${idx}" style="display:inline-block;margin-left:6px;padding:0 6px;border:1px solid currentColor;border-radius:50%;font-size:0.75rem;opacity:0.7;cursor:pointer;">?</span></button>`;
    } else {
      optsHtml += `<button class="option" data-i="${idx}">${annotate(opt)}</button>`;
    }
  });
  const officialNextLabel = quizState.idx+1===quizState.bank.length ? t('finishBtn') : t('nextBtn');
  const typeTag = itemType==='fillBlank' ? `<div class="type-tag">✏️ ${t('typeTagFill')}</div>` : '';
  panel.innerHTML = `
    <div class="q-count">${t('question')} ${quizState.idx+1} ${t('of')} ${quizState.bank.length}</div>
    ${typeTag}
    <div class="q-text">${annotate(item.q)}</div>
    <button id="readAloudBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:4px 10px;font-size:0.78rem;margin-bottom:10px;cursor:pointer;">${t('readAloud')}</button>
    <div id="optsWrap"${itemType==='fillBlank' ? ' class="chips"' : ''}>${optsHtml}</div>
    ${isOfficialTest ? '' : `<div class="reveal-gate" id="revealGate" style="display:none;margin-top:12px;padding:12px;background:var(--card-alt, rgba(250,204,21,0.08));border-radius:10px;">
      <div style="font-weight:600;font-size:0.88rem;">${t('selfExplainPrompt')}</div>
      <button class="primary" id="revealBtn" style="margin-top:10px;">${t('revealExplainBtn')}</button>
    </div>`}
    ${isOfficialTest ? '' : `<div class="explain" id="explainBox">${annotate(item.exp)}<br><button id="readExplainBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:3px 9px;font-size:0.76rem;margin-top:8px;cursor:pointer;">${t('readAloud')}</button></div>`}
    <br>
    <button class="primary" id="nextBtn" style="${isOfficialTest ? (quizState.selected===null?'opacity:0.5;':'') : 'display:none;'}">${isOfficialTest ? officialNextLabel : (quizState.idx+1===quizState.bank.length ? t('finishBtn') : t('nextBtn'))}</button>
  `;
  attachGlossaryHandlers(panel);
  if(isOfficialTest){
    panel.querySelectorAll('.opt-def-btn').forEach(el=>{
      el.addEventListener('click', function(e){
        e.stopPropagation();
        const idx = parseInt(this.dataset.opt);
        showOptionDefinition(dOpts[idx]);
      });
    });
  }
  document.getElementById('readAloudBtn').onclick = ()=>{
    const optLabels = ['A','B','C','D'];
    const optsText = dOpts.map((o,idx)=> `${optLabels[idx]}. ${o}`).join('. ');
    speak(item.q + '. ' + optsText);
  };
  const readExplainBtn = document.getElementById('readExplainBtn');
  if(readExplainBtn) readExplainBtn.onclick = (e)=>{ e.stopPropagation(); speak(item.exp); };
  // Self-explanation gate: right after answering, the student sees only ✓/✗ plus a prompt
  // to think through *why* before the explanation is revealed — a brief forced pause that
  // pushes toward elaborative processing instead of passively reading the explanation.
  const revealBtn = document.getElementById('revealBtn');
  if(revealBtn) revealBtn.onclick = ()=>{
    document.getElementById('revealGate').style.display = 'none';
    document.getElementById('explainBox').classList.add('show');
    document.getElementById('nextBtn').style.display = 'block';
  };

  if(isOfficialTest){
    document.querySelectorAll('#optsWrap .option').forEach(btn=>{
      btn.onclick = ()=>{
        quizState.selected = parseInt(btn.dataset.i);
        renderQuizQuestion();
      };
    });
    document.getElementById('nextBtn').onclick = ()=>{
      if(quizState.selected===null) return;
      const chosen = quizState.selected; const correct = dCorrect;
      quizState.records.push({ q:item.q, opts:dOpts, chosen, correct, exp:item.exp, right: chosen===correct, full: quizState.bank[quizState.idx] });
      if(chosen===correct) quizState.correctCount++;
      quizState.selected = null;
      if(quizState.idx+1 < quizState.bank.length){ quizState.idx++; renderQuizQuestion(); }
      else finishQuiz();
    };
    return;
  }

  document.querySelectorAll('#optsWrap .option').forEach(btn=>{
    btn.onclick = ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      const chosen = parseInt(btn.dataset.i); const correct = dCorrect;
      document.querySelectorAll('#optsWrap .option').forEach((b2,i2)=>{
        if(i2===correct){ b2.classList.add('correct'); b2.innerHTML = '✓ ' + b2.innerHTML; }
        else if(i2===chosen){ b2.classList.add('incorrect'); b2.innerHTML = '✗ ' + b2.innerHTML; }
      });
      if(chosen===correct) quizState.correctCount++;
      quizState.records.push({ q:item.q, opts:dOpts, chosen, correct, exp:item.exp, right: chosen===correct, full: quizState.bank[quizState.idx] });
      document.getElementById('revealGate').style.display = 'block';
    };
  });
  document.getElementById('nextBtn').onclick = ()=>{
    if(quizState.idx+1 < quizState.bank.length){ quizState.idx++; quizState.answered=false; renderQuizQuestion(); }
    else finishQuiz();
  };
}

// Duolingo-style tap-to-pair matching question. Data shape: fullItem.type==='match',
// fullItem[lang] = { prompt, pairs:[{term,def}, ...], exp }. The pairs array's index IS the
// answer key — pairs[i].term correctly matches pairs[i].def. Left/right columns are shuffled
// independently for display; quizState.matchPick tracks in-progress taps and is reset whenever
// a new question loads.
const MATCH_MAX_TRIES = 4;
function renderMatchQuestion(panel, fullItem){
  const item = fullItem[lang];
  if(!quizState.matchPick || quizState.matchPick.forIdx !== quizState.idx){
    const leftOrder = shuffleArray(item.pairs.map((p,i)=>i));
    const rightOrder = shuffleArray(item.pairs.map((p,i)=>i));
    // paired: left-index -> resolved (either genuinely matched, or revealed after running
    // out of tries — either way pairing is always left===right since a "pair" only resolves
    // once the correct match is made or given up on).
    // pairScore: left-index -> 1 (got it first try), 0.5 (got it after a retry), 0 (revealed after 4 misses)
    // attempts: left-index -> number of wrong taps so far on that term
    quizState.matchPick = { forIdx: quizState.idx, leftOrder, rightOrder, selectedLeft:null, paired:{}, pairScore:{}, attempts:{}, flash:null, done:false };
  }
  const ms = quizState.matchPick;
  const leftHtml = ms.leftOrder.map(i=>{
    let cls = 'match-btn';
    const resolved = ms.paired[i]!==undefined;
    if(resolved) cls += ' locked ' + (ms.pairScore[i]>0 ? 'correct' : 'incorrect');
    else if(ms.selectedLeft===i) cls += ' selected';
    if(ms.flash && ms.flash.left===i) cls += ' flash-wrong';
    // Note: term/def text is deliberately NOT run through annotate() here — these buttons
    // are often glossary words themselves (that's the whole point of a matching question),
    // and a clickable glossary-popup span inside the button would intercept the tap-to-pair
    // click instead of registering the pairing.
    return `<button class="${cls}" data-side="left" data-i="${i}" ${resolved?'disabled':''}>${item.pairs[i].term}</button>`;
  }).join('');
  const rightHtml = ms.rightOrder.map(i=>{
    let cls = 'match-btn';
    const resolved = ms.paired[i]!==undefined;
    if(resolved) cls += ' locked ' + (ms.pairScore[i]>0 ? 'correct' : 'incorrect');
    if(ms.flash && ms.flash.right===i) cls += ' flash-wrong';
    return `<button class="${cls}" data-side="right" data-i="${i}" ${resolved?'disabled':''}>${item.pairs[i].def}</button>`;
  }).join('');
  let triesMsg = '';
  if(ms.flash){
    const left = ms.flash.left;
    const triesLeft = MATCH_MAX_TRIES - (ms.attempts[left]||0);
    triesMsg = `<div class="match-tries">${t('matchTryAgain')} (${triesLeft} ${t('matchTriesLeft')})</div>`;
  } else if(ms.justRevealed!==null && ms.justRevealed!==undefined){
    triesMsg = `<div class="match-tries">${t('matchOutOfTries')}</div>`;
  }
  panel.innerHTML = `
    <div class="q-count">${t('question')} ${quizState.idx+1} ${t('of')} ${quizState.bank.length}</div>
    <div class="type-tag">🔗 ${t('typeTagMatch')}</div>
    <div class="q-text">${annotate(item.prompt)}</div>
    <div class="match-hint">${t('matchHint')}</div>
    <div class="match-cols">
      <div class="match-col">${leftHtml}</div>
      <div class="match-col">${rightHtml}</div>
    </div>
    ${triesMsg}
    ${ms.done ? `<div class="explain show">${annotate(item.exp)}<br><button id="readMatchExplainBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:3px 9px;font-size:0.76rem;margin-top:8px;cursor:pointer;">${t('readAloud')}</button></div><br>` : ''}
    <button class="primary" id="nextBtn" style="${ms.done?'':'display:none;'}">${quizState.idx+1===quizState.bank.length ? t('finishBtn') : t('nextBtn')}</button>
  `;
  attachGlossaryHandlers(panel);
  if(!ms.done){
    panel.querySelectorAll('.match-btn[data-side="left"]').forEach(btn=>{
      btn.onclick = ()=>{
        if(ms.flash) return; // ignore taps mid-flash animation
        ms.selectedLeft = parseInt(btn.dataset.i); renderQuizQuestion();
      };
    });
    panel.querySelectorAll('.match-btn[data-side="right"]').forEach(btn=>{
      btn.onclick = ()=>{
        if(ms.selectedLeft===null || ms.flash) return;
        const L = ms.selectedLeft;
        const R = parseInt(btn.dataset.i);
        ms.justRevealed = null;
        if(R === L){
          ms.paired[L] = L;
          ms.pairScore[L] = (ms.attempts[L]||0) === 0 ? 1 : 0.5;
          ms.selectedLeft = null;
          maybeFinishMatch();
          renderQuizQuestion();
        } else {
          ms.attempts[L] = (ms.attempts[L]||0) + 1;
          ms.selectedLeft = null;
          if(ms.attempts[L] >= MATCH_MAX_TRIES){
            ms.paired[L] = L; // reveal the correct pairing — out of tries
            ms.pairScore[L] = 0;
            ms.justRevealed = L;
            maybeFinishMatch();
            renderQuizQuestion();
          } else {
            ms.flash = { left: L, right: R };
            renderQuizQuestion();
            setTimeout(()=>{
              if(quizState && quizState.matchPick === ms){ ms.flash = null; renderQuizQuestion(); }
            }, 450);
          }
        }
      };
    });
  }
  function maybeFinishMatch(){
    if(Object.keys(ms.paired).length === item.pairs.length){
      ms.done = true;
      const scores = Object.values(ms.pairScore);
      const matchScore = scores.reduce((a,b)=>a+b,0) / item.pairs.length;
      quizState.correctCount += matchScore;
      quizState.records.push({ right: matchScore===1, full: fullItem, matchScore });
    }
  }
  if(ms.done){
    const readMatchExplainBtn = document.getElementById('readMatchExplainBtn');
    if(readMatchExplainBtn) readMatchExplainBtn.onclick = (e)=>{ e.stopPropagation(); speak(item.exp); };
    document.getElementById('nextBtn').onclick = ()=>{
      quizState.matchPick = null;
      if(quizState.idx+1 < quizState.bank.length){ quizState.idx++; renderQuizQuestion(); }
      else finishQuiz();
    };
  }
}

// Figures out what the "next part" is after a quiz result, so the results
// screen can offer a one-tap path forward instead of just Retake/Home.
// section -> next section in the same module, or the module test if that was
// the last section. moduleTest/cumulative -> first section of the next
// module, if one exists and has content. Returns null when there's nothing
// sensible to jump to (quick review, missed review, or the last module).
function getNextStep(qs){
  if(qs.kind==='section'){
    const m = MODULES[qs.modIdx];
    const idx = m.sections.findIndex(s=>s.key===qs.sectionKey);
    if(idx>=0 && idx < m.sections.length-1){
      const ns = m.sections[idx+1];
      return {
        label: `${t('continueToLabel')} ${ns.label[lang]} →`,
        run: ()=> ns.type==='walkthrough' ? startWalkthrough(qs.modIdx, ns) : startQuiz({kind:'section', modIdx:qs.modIdx, sectionKey:ns.key, bank:ns.bank, threshold:85})
      };
    }
    return {
      label: `${t('continueToLabel')} ${t('moduleTestLabel')} →`,
      run: ()=> startQuiz({kind:'moduleTest', modIdx:qs.modIdx, bank:m.moduleTest, threshold:70})
    };
  }
  if(qs.kind==='walkthrough'){
    const m = MODULES[qs.modIdx];
    const idx = m.sections.findIndex(s=>s.key===qs.section.key);
    if(idx>=0 && idx < m.sections.length-1){
      const ns = m.sections[idx+1];
      return {
        label: `${t('continueToLabel')} ${ns.label[lang]} →`,
        run: ()=> ns.type==='walkthrough' ? startWalkthrough(qs.modIdx, ns) : startQuiz({kind:'section', modIdx:qs.modIdx, sectionKey:ns.key, bank:ns.bank, threshold:85})
      };
    }
    return {
      label: `${t('continueToLabel')} ${t('moduleTestLabel')} →`,
      run: ()=> startQuiz({kind:'moduleTest', modIdx:qs.modIdx, bank:m.moduleTest, threshold:70})
    };
  }
  if(qs.kind==='moduleTest' || qs.kind==='cumulative'){
    const nextIdx = qs.modIdx+1;
    const nm = MODULES[nextIdx];
    if(nm && isModuleUnlocked(nextIdx) && nm.sections && nm.sections.length){
      const fs = nm.sections[0];
      return {
        label: `${t('continueToLabel')} ${nm.title[lang]} →`,
        run: ()=> fs.type==='walkthrough' ? startWalkthrough(nextIdx, fs) : startQuiz({kind:'section', modIdx:nextIdx, sectionKey:fs.key, bank:fs.bank, threshold:85})
      };
    }
    return null;
  }
  return null;
}

function finishQuiz(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  const pct = Math.round((quizState.correctCount / quizState.bank.length) * 100);
  const threshold = quizState.threshold;
  const passed = pct >= threshold;
  // Missed-question tracking: wrong answers get added to the review list, right
  // answers clear a question off it (however/wherever it gets answered right).
  // Every answered question also updates its spaced-repetition record, whichever
  // mode it was answered in — that's what feeds the "due for review" queue.
  (quizState.records||[]).forEach(r=>{
    if(!r.full) return;
    if(r.right) removeMissed(r.full); else addMissed(r.full);
    updateSRS(r.full, r.right);
  });
  saveMissed();
  if(quizState.kind==='section'){
    const p = ensureProgress(MODULES[quizState.modIdx].id);
    p.sec[quizState.sectionKey] = pct; saveProgress();
  } else if(quizState.kind==='moduleTest'){
    const p = ensureProgress(MODULES[quizState.modIdx].id);
    p.testScore = pct; p.testPassed = passed; saveProgress();
  } else if(quizState.kind==='cumulative'){
    cumulative['after_'+MODULES[quizState.modIdx].id] = {score:pct, passed}; saveCumulative();
  }
  const failMsg = quizState.kind==='section' ? t('failMsgSection') : t('failMsgTest');
  const passMsg = quizState.kind==='section' ? t('passMsgSection') : t('passMsgTest');
  const isOfficialTest = (quizState.kind==='moduleTest' || quizState.kind==='cumulative');
  let reviewHtml = '';
  if(isOfficialTest && quizState.records && quizState.records.length){
    reviewHtml = `<h3>${t('reviewLabel')}</h3>` + quizState.records.map((r,i)=>{
      const yourOpt = r.opts[r.chosen];
      const correctOpt = r.opts[r.correct];
      return `<div class="review-item">
        <div class="rq">${i+1}. ${annotate(r.q)}</div>
        <div class="ra ${r.right?'right':'wrong'}">${t('yourAnswer')}: ${yourOpt} ${r.right?'✓':'✗'}</div>
        ${r.right ? '' : `<div class="ra right">${t('correctAnswer')}: ${correctOpt}</div>`}
        <div class="rexp">${annotate(r.exp)}</div>
        <button class="review-read-btn" data-ridx="${i}" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:3px 9px;font-size:0.76rem;margin-top:6px;cursor:pointer;">${t('readAloud')}</button>
      </div>`;
    }).join('');
  }
  const nextStep = getNextStep(quizState);
  panel.innerHTML = `
    <div class="result-big">
      <div class="result-pct ${passed?'pass':'fail'}">${pct}%</div>
      <div class="result-msg">${t('yourScore')}: ${quizState.correctCount}/${quizState.bank.length}</div>
      <div class="result-msg">${passed ? passMsg : failMsg}</div>
      <div class="result-msg" style="margin-top:8px; font-weight:600;">${t('retakeEncourage')}</div>
      ${!passed ? `<div class="result-msg" style="margin-top:6px; color:var(--muted); font-size:0.88rem;">${t('retakeTips')}</div>` : ''}
      ${passed ? `<div class="donate-nudge" id="resultDonateNudge" style="margin-top:12px; padding:10px 14px; border-radius:10px; background:var(--card-alt, rgba(250,204,21,0.1)); cursor:pointer; font-size:0.88rem; text-align:left;">${t('donateNudge')}</div>` : ''}
    </div>
    <button class="primary" id="retakeQBtn">${t('retakeBtn')}</button><br><br>
    ${nextStep ? `<button class="primary" id="nextPartBtn" style="background:#16a34a;">${nextStep.label}</button><br><br>` : ''}
    <button class="primary" id="backQBtn" style="background:#475569;">${t('backHome')}</button>
    ${reviewHtml ? `<br><br>${reviewHtml}` : ''}
  `;
  if(reviewHtml){
    attachGlossaryHandlers(panel);
    panel.querySelectorAll('.review-read-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const r = quizState.records[parseInt(btn.dataset.ridx)];
        if(r) speak(r.exp);
      };
    });
  }
  const resultDonateNudge = document.getElementById('resultDonateNudge');
  if(resultDonateNudge) resultDonateNudge.onclick = ()=>{ topTab='support'; homeView=null; quizState=null; renderTopTabs(); renderPanel(); };
  document.getElementById('retakeQBtn').onclick = ()=>{
    if(quizState.kind==='cumulative') startCumulativeTest(quizState.modIdx);
    else if(quizState.kind==='quick') startQuiz({kind:'quick', bank: buildQuickReviewBank(10), threshold:70});
    else if(quizState.kind==='missed'){
      if(missed.length===0){ quizState=null; renderPanel(); return; }
      startQuiz({kind:'missed', bank: missed.map(x=>x.item), threshold:70});
    }
    else if(quizState.kind==='mixed') startQuiz({kind:'mixed', bank: buildMixedReviewBank(10), threshold:70});
    else startQuiz(quizState);
  };
  const nextPartBtn = document.getElementById('nextPartBtn');
  if(nextPartBtn) nextPartBtn.onclick = ()=> nextStep.run();
  document.getElementById('backQBtn').onclick = ()=>{
    // "Home" always means the actual home screen (module map), not just
    // back to the module detail page — regardless of what kind of quiz this was.
    homeView = null; topTab = 'home'; quizState = null; renderTopTabs(); renderPanel();
  };
}

function renderCards(panel){
  const unlockedModules = MODULES.map((m,i)=>({m,i})).filter(x=> !x.m.comingSoon && isModuleUnlocked(x.i));
  if(cardState.modIdx===null || !unlockedModules.find(x=>x.i===cardState.modIdx)) cardState.modIdx = unlockedModules[0]?.i ?? 0;
  const mod = MODULES[cardState.modIdx];
  const deck = mod.cards || [];
  if(cardState.idx >= deck.length) cardState.idx = 0;
  const card = deck[cardState.idx] ? deck[cardState.idx][lang] : {q:'',a:''};
  let options = unlockedModules.map(x=>`<option value="${x.i}" ${x.i===cardState.modIdx?'selected':''}>${x.m.title[lang]}</option>`).join('');
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <select id="modFilter">${options}</select>
      <button id="shuffleCardsBtn">${t('shuffleBtn')}</button>
    </div>
    <div style="text-align:center; font-size:0.8rem; color:var(--muted); margin-bottom:8px;">${deck.length? (cardState.idx+1)+' / '+deck.length : ''}</div>
    <div class="scene">
      <div class="card" id="flashCard">
        <div class="face front"><div class="tag">${lang==='en'?'Question':'Pregunta'}</div><div>${annotate(card.q||'')}</div><div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">${t('flipHint')}</div></div>
        <div class="face back"><div class="tag">${lang==='en'?'Answer':'Respuesta'}</div><div style="font-weight:500;font-size:0.95rem;">${annotate(card.a||'')}</div><div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">${t('flipBackHint')}</div></div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:8px;">
      <button id="readAloudCardBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;">${t('readAloud')}</button>
    </div>
    <div class="nav">
      <button id="prevCardBtn">${t('prevBtn')}</button>
      <button id="flipCardBtn">${t('flipBtn')}</button>
      <button id="nextCardBtn2">${t('nextCardBtn')}</button>
    </div>
  `;
  attachGlossaryHandlers(panel);
  document.getElementById('readAloudCardBtn').onclick = ()=>{
    const showingBack = document.getElementById('flashCard').classList.contains('flipped');
    speak(showingBack ? (card.a||'') : (card.q||''));
  };
  document.getElementById('modFilter').onchange = (e)=>{ cardState.modIdx = parseInt(e.target.value); cardState.idx=0; renderCards(panel); };
  document.getElementById('flashCard').onclick = ()=> document.getElementById('flashCard').classList.toggle('flipped');
  document.getElementById('flipCardBtn').onclick = ()=> document.getElementById('flashCard').classList.toggle('flipped');
  document.getElementById('nextCardBtn2').onclick = ()=>{ if(deck.length){ cardState.idx=(cardState.idx+1)%deck.length; renderCards(panel);} };
  document.getElementById('prevCardBtn').onclick = ()=>{ if(deck.length){ cardState.idx=(cardState.idx-1+deck.length)%deck.length; renderCards(panel);} };
  document.getElementById('shuffleCardsBtn').onclick = ()=>{
    for(let a=deck.length-1;a>0;a--){ const b=Math.floor(Math.random()*(a+1)); [deck[a],deck[b]]=[deck[b],deck[a]]; }
    cardState.idx=0; renderCards(panel);
  };
}

function renderSupport(panel){
  panel.innerHTML = `
    <p>${t('supportIntro')}</p>
    <p>${t('supportIntro2')}</p>
    <div class="tip-box">
      <h3>${t('supportHeading')}</h3>
      <div class="tip-row"><span>${t('cashapp')}</span><span style="font-weight:700;">$AgentKodak</span></div>
      <div class="tip-row"><span>${t('zelle')}</span><span style="font-weight:700;">(571) 331-5770</span></div>
    </div>
    <button class="small" id="changeStudyTimeBtn" style="margin-top:16px;background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;">${t('changeStudyTime')}</button>
  `;
  document.getElementById('changeStudyTimeBtn').onclick = ()=> openStudyPrefModal(null);
}

/* ============ INIT ============ */
document.getElementById('btnEN').onclick = ()=> setLang('en');
document.getElementById('btnES').onclick = ()=> setLang('es');
document.getElementById('glossCloseBtn').onclick = ()=> closeGlossary();
document.getElementById('glossaryOverlay').addEventListener('click', function(e){ if(e.target===this) closeGlossary(); });
document.getElementById('studyPrefOverlay').addEventListener('click', function(e){ if(e.target===this) this.style.display='none'; });

document.getElementById('btnTextSize').onclick = ()=>{ textScale = (textScale+1)%TEXT_SCALES.length; applyTextScale(); };
document.getElementById('btnTheme').onclick = ()=>{ theme = theme==='light' ? 'dark' : 'light'; applyTheme(); };
document.getElementById('btnGoHome').onclick = ()=>{
  // Always-visible "go home" button — works from ANY screen (module map, module
  // detail, mid-quiz, flashcards, support tab, or the post-quiz review screen).
  homeView = null; topTab = 'home'; quizState = null; renderTopTabs(); renderPanel();
};
applyTextScale();
applyTheme();

function showOnboarding(){
  document.getElementById('onboardTitle').textContent = t('onboardTitle');
  document.getElementById('onboardBody').textContent = t('onboardBody');
  document.getElementById('onboardCloseBtn').textContent = t('onboardClose');
  document.getElementById('onboardingOverlay').style.display = 'flex';
}
document.getElementById('onboardCloseBtn').onclick = ()=>{
  document.getElementById('onboardingOverlay').style.display = 'none';
  localStorage.setItem('nccer_onboarded', '1');
};
document.getElementById('onboardingOverlay').addEventListener('click', function(e){
  if(e.target===this){ this.style.display='none'; localStorage.setItem('nccer_onboarded','1'); }
});

setLang(lang);
if(!localStorage.getItem('nccer_onboarded')) showOnboarding();
</script>
