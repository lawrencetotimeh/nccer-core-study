<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="ui-monospace, monospace">
  <rect width="400" height="260" fill="#ffffff"/>
  <!-- wall -->
  <rect x="250" y="20" width="16" height="220" fill="#334155"/>
  <!-- ground -->
  <rect x="20" y="234" width="360" height="8" fill="#334155"/>
  <!-- ladder -->
  <g stroke="#b45309" stroke-width="5" stroke-linecap="round">
    <line x1="120" y1="234" x2="250" y2="52"/>
    <line x1="146" y1="234" x2="276" y2="52" transform="translate(-14,0)"/>
  </g>
  <g stroke="#b45309" stroke-width="3.5">
    <line x1="140" y1="212" x2="164" y2="212"/>
    <line x1="153" y1="194" x2="177" y2="194"/>
    <line x1="166" y1="176" x2="190" y2="176"/>
    <line x1="179" y1="158" x2="203" y2="158"/>
    <line x1="192" y1="140" x2="216" y2="140"/>
    <line x1="205" y1="122" x2="229" y2="122"/>
    <line x1="218" y1="104" x2="242" y2="104"/>
    <line x1="228" y1="86" x2="252" y2="86"/>
  </g>
  <!-- height dimension -->
  <line x1="300" y1="52" x2="300" y2="234" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="294,60 300,48 306,60" fill="#2563eb"/>
  <polygon points="294,226 300,238 306,226" fill="#2563eb"/>
  <rect x="312" y="128" width="60" height="26" fill="#ffffff"/>
  <text x="342" y="146" text-anchor="middle" font-size="15" fill="#2563eb">H</text>
  <!-- base setback dimension with ? -->
  <line x1="120" y1="250" x2="250" y2="250" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="128,244 116,250 128,256" fill="#dc2626"/>
  <polygon points="242,244 254,250 242,256" fill="#dc2626"/>
  <circle cx="185" cy="250" r="15" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="185" y="257" text-anchor="middle" font-size="18" font-weight="bold" fill="#dc2626">?</text>
</svg>
