<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="ui-monospace, monospace">
  <rect width="400" height="260" fill="#ffffff"/>
  <!-- deck -->
  <rect x="40" y="190" width="320" height="14" fill="#334155"/>
  <rect x="40" y="204" width="320" height="36" fill="#cbd5e1"/>
