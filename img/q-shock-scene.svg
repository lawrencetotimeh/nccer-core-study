<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="ui-monospace, monospace">
  <rect width="400" height="260" fill="#ffffff"/>
  <!-- ground -->
  <rect x="20" y="220" width="360" height="8" fill="#334155"/>
  <!-- energized cable from panel -->
  <rect x="40" y="60" width="46" height="70" rx="4" fill="#e2e8f0" stroke="#334155" stroke-width="2.5"/>
  <circle cx="63" cy="80" r="6" fill="#dc2626"/>
  <rect x="56" y="96" width="14" height="22" rx="3" fill="#334155"/>
  <path d="M 86 118 Q 160 150 218 196" stroke="#0f1720" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- sparks at contact -->
  <g stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <line x1="222" y1="186" x2="230" y2="172"/>
    <line x1="230" y1="196" x2="244" y2="192"/>
    <line x1="214" y1="180" x2="208" y2="166"/>
  </g>
  <!-- downed worker in contact -->
  <g stroke="#0f1720" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="300" cy="206" r="10" fill="#ffffff"/>
    <line x1="290" y1="208" x2="252" y2="204"/>
    <line x1="262" y1="205" x2="224" y2="196"/>
    <line x1="268" y1="206" x2="258" y2="220"/>
    <line x1="252" y1="204" x2="242" y2="218"/>
  </g>
  <!-- bolt symbol above victim -->
  <path d="M 300 158 L 288 180 L 298 180 L 290 198" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- bystander thinking -->
  <g stroke="#0f1720" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="352" cy="120" r="10" fill="#ffffff"/>
    <line x1="352" y1="130" x2="352" y2="160"/>
    <line x1="352" y1="138" x2="338" y2="150"/>
    <line x1="352" y1="138" x2="366" y2="148"/>
    <line x1="352" y1="160" x2="344" y2="180"/>
    <line x1="352" y1="160" x2="360" y2="180"/>
  </g>
  <circle cx="378" cy="86" r="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="378" y="94" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">?</text>
</svg>
