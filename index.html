<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCCER Core Study Tool</title>
<style>
  :root{
    --bg:#0f1720; --panel:#ffffff; --accent:#2563eb; --accent2:#1d4ed8;
    --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626;
    --border:#e5e7eb; --amber:#d97706;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f1720,#1e293b); min-height:100vh; color:var(--text);
    display:flex; flex-direction:column; align-items:center; padding:20px 14px 60px;
  }
  .topbar{ width:100%; max-width:640px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1{ color:#fff; font-size:1.25rem; margin:0; }
  .lang-toggle{ display:flex; gap:6px; }
  .lang-toggle button{ padding:6px 12px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.8rem; }
  .lang-toggle button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .subtitle{ color:#94a3b8; font-size:0.85rem; margin-bottom:16px; text-align:center; max-width:640px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; max-width:640px; }
  .tab-btn{ padding:9px 14px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.82rem; }
  .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .panel{ width:100%; max-width:640px; background:var(--panel); border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .hint{ font-size:0.78rem; color:var(--muted); margin-bottom:10px; }
  .breadcrumb{ font-size:0.85rem; color:var(--accent2); cursor:pointer; margin-bottom:12px; display:inline-block; }
  .module-card{ border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .module-card.clickable{ cursor:pointer; }
  .module-card.clickable:hover{ border-color:var(--accent); }
  .module-card.locked{ opacity:0.55; }
  .module-card .mc-title{ font-weight:600; font-size:0.95rem; }
  .module-card .mc-sub{ font-size:0.75rem; color:var(--muted); margin-top:2px; }
  .module-card .mc-date{ font-size:0.75rem; color:var(--muted); margin-top:4px; }
  .mc-seq{ display:inline-block; min-width:1.6em; text-align:center; margin-right:2px; padding:1px 7px; border-radius:999px; background:var(--accent); color:#fff; font-size:0.85em; font-weight:700; }
  button.cal-btn{ width:auto; padding:5px 10px; font-size:0.72rem; background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:8px; cursor:pointer; white-space:nowrap; }
  button.cal-btn:hover{ background:var(--accent); color:#fff; }
  .badge{ font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.locked{ background:#f1f5f9; color:var(--muted); }
  .badge.progress{ background:#fef3c7; color:var(--amber); }
  .badge.done{ background:#dcfce7; color:var(--green); }
  .badge.coming{ background:#e0e7ff; color:#4338ca; }
  .cum-card{ border:2px dashed #93c5fd; border-radius:12px; padding:14px 16px; margin:4px 0 14px; background:#eff6ff; }
  .test-box{ border:2px solid var(--accent); border-radius:14px; padding:16px 18px; margin:6px 0 18px; background:var(--test-box-bg, #fff7ed); }
  .test-box h3{ margin-top:0; }
  button.test-btn{ background:var(--accent); color:#fff; border:none; padding:16px 18px; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; width:100%; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  button.test-btn:hover{ background:var(--accent2); }
  .score-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .score-card{ border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .score-card .pct{ font-size:1.3rem; font-weight:700; }
  .score-card .lbl{ font-size:0.72rem; color:var(--muted); margin-top:2px;}
  .pass{ color:var(--green); } .fail{ color:var(--red); } .pending{ color:var(--muted); }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-size:0.9rem; cursor:pointer; width:100%; }
  button.primary:hover{ background:var(--accent2); }
  button.small{ width:auto; padding:8px 14px; font-size:0.82rem; }
  button.option{ display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.9rem; }
  button.option:hover{ border-color:var(--accent); }
  button.option.correct{ background:#bbf7d0; border:2px solid #15803d; color:#14532d; font-weight:700; }
  button.option.incorrect{ background:#fecaca; border:2px solid #b91c1c; color:#7f1d1d; font-weight:700; }
  button.option.selected{ background:#dbeafe; border:2px solid var(--accent); }
  .review-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; text-align:left; }
  .review-item .rq{ font-weight:600; font-size:0.88rem; margin-bottom:6px; }
  .review-item .ra{ font-size:0.84rem; margin-bottom:3px; }
  .review-item .ra.wrong{ color:#b91c1c; }
  .review-item .ra.right{ color:#15803d; }
  .review-item .rexp{ font-size:0.82rem; color:var(--muted); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }
  .q-count{ font-size:0.78rem; color:var(--muted); margin-bottom:6px; }
  .q-text{ font-size:1.02rem; font-weight:600; margin-bottom:12px; }
  .explain{ margin-top:12px; padding:12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; font-size:0.86rem; display:none; }
  .explain.show{ display:block; }
  .result-big{ text-align:center; padding:16px 0; }
  .result-pct{ font-size:2.2rem; font-weight:800; }
  .result-msg{ font-size:0.92rem; color:var(--muted); margin-top:6px; }
  .scene{ width:100%; height:290px; perspective:1400px; margin-bottom:16px; }
  .card{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .card.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center; }
  .front{ background:#fff; border:1px solid var(--border); }
  .back{ background:#eff6ff; border:1px solid #bfdbfe; transform:rotateY(180deg); }
  .tag{ position:absolute; top:12px; left:14px; font-size:0.66rem; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .nav{ display:flex; gap:10px; justify-content:center; margin-top:4px; }
  .nav button{ font-size:0.82rem; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .tip-box{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; }
  .tip-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border); }
  .tip-row:first-of-type{ border-top:none; }
  select{ padding:6px 10px; border-radius:8px; border:1px solid var(--border); }
  footer{ color:#64748b; font-size:0.72rem; margin-top:18px; text-align:center; max-width:600px; }
  .glossary-term{ text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; color:var(--accent2); cursor:pointer; font-weight:600; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(15,23,32,0.65); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:#fff; border-radius:14px; padding:24px; max-width:380px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.35); }
  .modal-term{ font-weight:700; font-size:1.1rem; margin-bottom:8px; color:var(--accent2); }
  .modal-def{ font-size:0.92rem; color:var(--text); margin-bottom:16px; line-height:1.5; }
  .pref-label{ display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px; }
  .pref-cadence-opt{ display:flex; align-items:flex-start; gap:8px; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .pref-cadence-opt input{ margin-top:3px; }
  .pref-cadence-opt .pco-title{ font-weight:600; font-size:0.88rem; }
  .pref-cadence-opt .pco-sub{ font-size:0.76rem; color:var(--muted); margin-top:2px; }
  .study-minutes{ font-size:0.75rem; color:var(--muted); }

  /* ---- light mode ---- */
  body.light-mode{ background:linear-gradient(160deg,#f8fafc,#e2e8f0); }
  body.light-mode h1{ color:#0f1720; }
  body.light-mode .subtitle{ color:#475569; }
  body.light-mode .lang-toggle button, body.light-mode .tab-btn, body.light-mode .icon-btn{
    background:#e2e8f0; color:#334155; border-color:#cbd5e1;
  }
  body.light-mode .lang-toggle button.active, body.light-mode .tab-btn.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  body.light-mode footer{ color:#64748b; }

  /* ---- topbar icon buttons (text size / theme) ---- */
  .icon-btn{ padding:6px 10px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.8rem; font-weight:700; }
  .topbar-right{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

  /* ---- continue / streak / quick-review / missed-review cards ---- */
  .continue-card{ border:2px solid var(--accent); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:#eff6ff; cursor:pointer; }
  .continue-card:hover{ background:#dbeafe; }
  .continue-card .cc-label{ font-size:0.72rem; text-transform:uppercase; font-weight:700; color:var(--accent2); letter-spacing:0.03em; }
  .continue-card .cc-title{ font-weight:700; font-size:1rem; margin-top:2px; }
  .streak-line{ font-size:0.85rem; color:var(--amber); font-weight:600; margin-bottom:10px; }
  .quick-card, .missed-card{ border:1px dashed #94a3b8; border-radius:12px; padding:12px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; background:#f8fafc; }
  .quick-card:hover, .missed-card:hover{ border-color:var(--accent); }
  .quick-card .qc-title, .missed-card .qc-title{ font-weight:600; font-size:0.92rem; }
  .quick-card .qc-sub, .missed-card .qc-sub{ font-size:0.75rem; color:var(--muted); margin-top:2px; }

  /* bigger, easier-to-tap answer buttons */
  button.option{ min-height:44px; }
  button.primary{ min-height:46px; }

  /* ---- Duolingo-style mixed question types: fill-in-the-blank word bank + matching ---- */
  .type-tag{ display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--accent2); background:#eff6ff; border:1px solid #bfdbfe; border-radius:999px; padding:2px 9px; margin-bottom:8px; }
  #optsWrap.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  #optsWrap.chips button.option{ display:inline-block; width:auto; margin:0; padding:9px 16px; border-radius:999px; font-weight:600; }
  .match-cols{ display:flex; gap:10px; margin:12px 0; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .match-btn{ display:block; width:100%; text-align:left; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.85rem; line-height:1.25; }
  .match-btn:hover{ border-color:var(--accent); }
  .match-btn.selected{ background:#dbeafe; border:2px solid var(--accent); }
  .match-btn.locked{ cursor:default; opacity:0.75; }
  .match-btn.correct{ background:#bbf7d0; border:2px solid #15803d; color:#14532d; font-weight:700; }
  .match-btn.incorrect{ background:#fecaca; border:2px solid #b91c1c; color:#7f1d1d; font-weight:700; }
  .match-btn.flash-wrong{ animation: matchShake 0.35s; background:#fecaca; border:2px solid #b91c1c; }
  @keyframes matchShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  .match-tries{ font-size:0.78rem; color:var(--muted); margin-top:4px; }
  .match-hint{ font-size:0.78rem; color:var(--muted); margin-bottom:8px; }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="appTitle">NCCER Core Study Tool</h1>
  <div class="topbar-right">
    <button id="btnGoHome" class="icon-btn" title="Go home" style="background:#2563eb;border-color:#2563eb;color:#fff;">🏠 Home</button>
    <button id="btnTextSize" class="icon-btn" title="Text size">Aa</button>
    <button id="btnTheme" class="icon-btn" title="Light / dark">🌙</button>
    <div class="lang-toggle">
      <button id="btnEN" class="active">EN</button>
      <button id="btnES">ES</button>
    </div>
  </div>
</div>
<div class="subtitle" id="subtitle"></div>

<div class="tabs" id="topTabs"></div>
<div class="panel" id="panel"></div>
<footer id="footerNote"></footer>

<div class="modal-overlay" id="glossaryOverlay">
  <div class="modal-box">
    <div class="modal-term" id="glossTermText"></div>
    <div class="modal-def" id="glossDefText"></div>
    <button class="primary" id="glossCloseBtn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="onboardingOverlay">
  <div class="modal-box">
    <div class="modal-term" id="onboardTitle"></div>
    <div class="modal-def" id="onboardBody" style="white-space:pre-line;"></div>
    <button class="primary" id="onboardCloseBtn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="studyPrefOverlay">
  <div class="modal-box">
    <div class="modal-term" id="studyPrefTitle"></div>
    <div class="modal-def" id="studyPrefIntro"></div>
    <label class="pref-label" id="studyPrefTimeLabel"></label>
    <input type="time" id="studyPrefTimeInput" value="19:00" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:1rem;margin-bottom:14px;background:var(--panel-bg,#fff);color:inherit;">
    <label class="pref-label" id="studyPrefCadenceLabel"></label>
    <div id="studyPrefCadenceOpts" style="margin-bottom:16px;"></div>
    <button class="primary" id="studyPrefSaveBtn"></button>
    <button class="primary" id="studyPrefCancelBtn" style="background:#475569;margin-top:8px;"></button>
  </div>
</div>

/* ============ GLOSSARY ============ */
const GLOSSARY = {
  craftProfessional:{en:{term:"craft professional",def:"A trained and skilled individual who designs and builds things, and conforms to the technical and ethical standards of their trade."},es:{term:"profesional del oficio",def:"Una persona capacitada y calificada que diseña y construye cosas, y cumple con los estándares técnicos y éticos de su oficio."}},
  craftTrade:{en:{term:"craft/trade",def:"A general term referring to one of the many construction specialties (like carpentry, welding, or masonry)."},es:{term:"oficio",def:"Un término general que se refiere a una de las muchas especialidades de la construcción."}},
  infrastructure:{en:{term:"infrastructure",def:"The transportation, water, electrical, and telecommunications systems that allow communities and countries to operate."},es:{term:"infraestructura",def:"Los sistemas de transporte, agua, electricidad y telecomunicaciones que permiten que las comunidades y los países funcionen."}},
  ppe:{en:{term:"PPE",def:"Personal protective equipment — clothing or equipment designed to prevent or reduce injuries (hard hats, gloves, safety glasses, etc.)."},es:{term:"EPP",def:"Equipo de protección personal: ropa o equipo diseñado para prevenir o reducir lesiones."}},
  cad:{en:{term:"CAD",def:"Computer-aided design — the use of computers to digitally sketch 2D or 3D construction designs."},es:{term:"CAD",def:"Diseño asistido por computadora: el uso de computadoras para dibujar digitalmente diseños en 2D o 3D."}},
  bim:{en:{term:"BIM",def:"Building information modeling — software that reads building data to create a virtual picture of a facility before it's built."},es:{term:"BIM",def:"Modelado de información de construcción: software que crea una imagen virtual de una instalación antes de construirla."}},
  vr:{en:{term:"VR",def:"Virtual reality — a 3D model of a construction site that lets users immerse themselves and spot issues before work begins."},es:{term:"RV",def:"Realidad virtual: un modelo 3D de un sitio que permite detectar problemas antes de comenzar el trabajo."}},
  sector:{en:{term:"sector",def:"A category of construction distinguished by specific types of work, materials, equipment, and skills."},es:{term:"sector",def:"Una categoría de construcción distinguida por tipos específicos de trabajo, materiales, equipo y habilidades."}},
  contractor:{en:{term:"contractor",def:"Oversees many parts of a construction project. Works directly with the project owner."},es:{term:"contratista",def:"Supervisa muchas partes de un proyecto de construcción. Trabaja directamente con el dueño del proyecto."}},
  projectOwner:{en:{term:"project owner",def:"The initiator of the project who usually finances the building endeavor."},es:{term:"dueño del proyecto",def:"El iniciador del proyecto que generalmente financia la obra."}},
  subcontractor:{en:{term:"subcontractor",def:"Employs craft professionals with specialized skills for one part of a project, like HVAC, electrical, or plumbing."},es:{term:"subcontratista",def:"Emplea a profesionales con habilidades especializadas para una parte de un proyecto, como HVAC, eléctrico o plomería."}},
  crewLeader:{en:{term:"crew leader",def:"Also called foreman — oversees a crew of craft professionals, making sure work is done correctly and on time."},es:{term:"líder de cuadrilla",def:"También llamado capataz: gestiona una cuadrilla de profesionales, asegurando que el trabajo se haga correctamente y a tiempo."}},
  siteSuperintendent:{en:{term:"site superintendent",def:"Manages day-to-day activities on a construction site and supervises the subcontractors."},es:{term:"superintendente de obra",def:"Gestiona las actividades diarias en un sitio de construcción y supervisa a los subcontratistas."}},
  projectManager:{en:{term:"project manager",def:"Oversees the planning and delivery of construction projects on time and within budget. Typically holds a university degree."},es:{term:"gerente de proyecto",def:"Supervisa la planificación y entrega de proyectos a tiempo y dentro del presupuesto. Generalmente tiene un título universitario."}},
  cte:{en:{term:"CTE",def:"Career and technical education — high school/technical center programs that let students explore construction careers."},es:{term:"CTE",def:"Educación profesional y técnica: programas que permiten explorar carreras de construcción."}},
  apprenticeship:{en:{term:"apprenticeship",def:"A program to gain skills on the job under experienced professionals, often earning money while training."},es:{term:"aprendizaje",def:"Un programa para adquirir habilidades en el trabajo bajo profesionales experimentados, ganando dinero mientras te capacitas."}},
  ojl:{en:{term:"OJL",def:"On-the-job learning — hands-on training completed while working."},es:{term:"OJL",def:"Aprendizaje en el trabajo: capacitación práctica realizada mientras se trabaja."}},
  leed:{en:{term:"LEED",def:"The international standard used for certifying environmentally sound, sustainable buildings."},es:{term:"LEED",def:"El estándar internacional para certificar edificios ambientalmente sostenibles."}},

  hepa:{en:{term:"HEPA",def:"High-Efficiency Particulate Air — a filter standard capturing at least 99.97 percent of particles 0.3 microns or larger, used to filter hazardous dust like silica."},es:{term:"HEPA",def:"Aire Particulado de Alta Eficiencia: un estándar de filtro que captura al menos el 99.97 por ciento de partículas de 0.3 micras o más, usado para filtrar polvo peligroso como la sílice."}},
  ghs:{en:{term:"GHS",def:"Globally Harmonized System — the international standard for labeling hazardous chemicals with consistent pictograms and hazard statements."},es:{term:"GHS",def:"Sistema Globalmente Armonizado: el estándar internacional para etiquetar químicos peligrosos con pictogramas y advertencias consistentes."}},
  fatalFour:{en:{term:"fatal four",def:"The four leading causes of construction worker deaths: falls, struck-by, electrical hazards, and caught-in/between — together responsible for nearly 3 out of 5 deaths."},es:{term:"cuatro fatales",def:"Las cuatro causas principales de muerte de trabajadores de la construcción: caídas, golpeado por objeto, riesgos eléctricos y atrapado en/entre; juntas causan casi 3 de cada 5 muertes."}},
  jargon:{en:{term:"jargon",def:"Specialized terms used in a particular industry or trade — using it with someone who doesn't know it creates a barrier to communication."},es:{term:"jerga",def:"Términos especializados usados en una industria u oficio particular — usarla con alguien que no la conoce crea una barrera de comunicación."}},
  nonverbalCommunication:{en:{term:"nonverbal communication",def:"All communication that doesn't use words — facial expressions, gestures, posture, and body language that communicate feelings and attitudes."},es:{term:"comunicación no verbal",def:"Toda comunicación que no usa palabras — expresiones faciales, gestos, postura y lenguaje corporal que comunican sentimientos y actitudes."}},
  activeListening:{en:{term:"active listening",def:"A process that involves listening for a total meaning, paying attention to both the words and the body language of the person speaking, and being aware of the possible consequences of not listening."},es:{term:"escucha activa",def:"Un proceso que implica escuchar el significado total, prestando atención tanto a las palabras como al lenguaje corporal de quien habla, y siendo consciente de las posibles consecuencias de no escuchar."}},

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function annotate(text){
  const entries = Object.keys(GLOSSARY).map(k=>({key:k, pattern: GLOSSARY[k][lang].term}));
  entries.sort((a,b)=> b.pattern.length - a.pattern.length);
  const alternation = entries.map(e=> escapeRegExp(e.pattern)).join('|');
  const re = new RegExp('\\b(' + alternation + ')\\b', 'gi');
  return text.replace(re, (match)=>{
    const found = entries.find(e=> e.pattern.toLowerCase() === match.toLowerCase());
    return `<span class="glossary-term" data-term="${found?found.key:''}">${match}</span>`;
  });
}
function attachGlossaryHandlers(container){
  container.querySelectorAll('.glossary-term').forEach(el=>{
    el.addEventListener('click', function(e){ e.stopPropagation(); openGlossary(this.dataset.term); });
  });
}
function openGlossary(key){
  const g = GLOSSARY[key]; if(!g) return;
  document.getElementById('glossTermText').textContent = g[lang].term;
  document.getElementById('glossDefText').textContent = g[lang].def;
  document.getElementById('glossaryOverlay').style.display = 'flex';
}
function closeGlossary(){ document.getElementById('glossaryOverlay').style.display='none'; }

/* ============ STUDY TIME / CADENCE PREFERENCE MODAL ============ */
// onSave (optional): called after the person hits Save, with nothing to pass —
// read prefs back out via getStudyPrefs(). Used so "Add to calendar" can chain
// straight into a download the very first time, with no extra click needed.
function openStudyPrefModal(onSave){
  const existing = getStudyPrefs();
  document.getElementById('studyPrefTitle').textContent = t('studyPrefTitle');
  document.getElementById('studyPrefIntro').textContent = t('studyPrefIntro');
  document.getElementById('studyPrefTimeLabel').textContent = t('studyPrefTimeLabel');
  document.getElementById('studyPrefCadenceLabel').textContent = t('studyPrefCadenceLabel');
  document.getElementById('studyPrefSaveBtn').textContent = t('studyPrefSave');
  document.getElementById('studyPrefCancelBtn').textContent = t('studyPrefCancel');
  document.getElementById('studyPrefTimeInput').value = existing ? existing.time : '19:00';
  const cadence = existing ? existing.cadence : 'spaced';
  const opts = [
    {key:'spaced', title:t('cadenceSpacedTitle'), sub:t('cadenceSpacedSub')},
    {key:'single', title:t('cadenceSingleTitle'), sub:t('cadenceSingleSub')}
  ];
  document.getElementById('studyPrefCadenceOpts').innerHTML = opts.map(o=>`
    <label class="pref-cadence-opt">
      <input type="radio" name="studyCadence" value="${o.key}" ${cadence===o.key?'checked':''}>
      <div><div class="pco-title">${o.title}</div><div class="pco-sub">${o.sub}</div></div>
    </label>
  `).join('');
  document.getElementById('studyPrefOverlay').style.display = 'flex';
  document.getElementById('studyPrefSaveBtn').onclick = ()=>{
    const time = document.getElementById('studyPrefTimeInput').value || '19:00';
    const cadenceSel = document.querySelector('input[name="studyCadence"]:checked');
    saveStudyPrefs({time, cadence: cadenceSel ? cadenceSel.value : 'spaced'});
    document.getElementById('studyPrefOverlay').style.display = 'none';
    if(onSave) onSave();
  };
  document.getElementById('studyPrefCancelBtn').onclick = ()=>{
    document.getElementById('studyPrefOverlay').style.display = 'none';
  };
}

/* ============ READ ALOUD (TEXT-TO-SPEECH) ============ */
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(stripHtml(text));
  utter.lang = lang==='es' ? 'es-ES' : 'en-US';
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
}
function stopSpeaking(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

  {en:{q:"The minimum safe working distance from an exposed electrical conductor ________.",opts:["is always exactly 6 inches (15 cm)","is always exactly 1 foot (30 cm)","depends on the voltage — higher voltage requires greater distance","does not matter as long as you wear gloves"],c:2,exp:"It depends on the voltage. A minimum of 10 feet (3 m) applies for conductors carrying 50,000 volts or less; greater distances are required for higher voltages. 📖 p.80-84"},

  {en:{q:"If you find someone who has been shocked and is still in contact with the power source, you should ________.",opts:["pull them away with your bare hands immediately","touch them with a metal tool to break contact","immediately shut off the power to the circuit, without touching the victim","wait for them to let go on their own"],c:2,exp:"Immediately shut off the power. Never touch the victim or the source with your hand, foot, or any object — you could become part of the circuit. 📖 p.80-84"},

   es:{q:"Los disyuntores e interruptores de desconexión usados en un bloqueo son ejemplos de ________.",opts:["dispositivos aislantes de energía","dispositivos solo de etiquetado","EPP","GFCIs"],c:0,exp:"Dispositivos aislantes de energía: se colocan en posición de apagado y luego se bloquean para que el equipo no pueda reenergizarse. 📖 pág. 84-85"}},
  {en:{q:"In a lockout/tagout (LOTO) procedure, who is normally allowed to remove a worker's lock?",opts:["Any co-worker who needs the equipment","Only that same worker (except in an authorized emergency)","The site security guard","Whoever put the tag on first, regardless of who owns the lock"],c:1,exp:"Generally only the person who applied the lock removes it — except in an emergency, when a supervisor or other employer-authorized person may do so. 📖 p.84-85"},
   es:{q:"En un procedimiento de bloqueo/etiquetado (LOTO), ¿quién normalmente puede quitar el candado de un trabajador?",opts:["Cualquier compañero que necesite el equipo","Solo ese mismo trabajador (salvo en una emergencia autorizada)","El guardia de seguridad del sitio","Quien haya puesto la etiqueta primero, sin importar quién sea dueño del candado"],c:1,exp:"Generalmente solo la persona que aplicó el candado lo retira, salvo en una emergencia, cuando un supervisor u otra persona autorizada por el empleador puede hacerlo. 📖 pág. 84-85"}},

   es:{q:"HAZCOM clasifica toda la pintura, el concreto y el polvo de madera como ________.",opts:["materiales peligrosos","materiales comunes","materiales económicos","materiales no peligrosos"],c:0,exp:"Materiales peligrosos. Bajo HAZCOM (Estándar de Comunicación de Riesgos, también llamado Derecho a Saber), estos requieren etiquetado adecuado, hojas SDS y capacitación de los trabajadores. 📖 pág. 117-120"}},
  {en:{q:"Under HAZCOM, if you spot a hazard on your job site, you must ________.",opts:["report it to your supervisor","leave immediately","notify your co-workers","correct the problem"],c:0,exp:"Report it to your supervisor — HAZCOM gives every worker the right (and responsibility) to flag hazards immediately rather than working around them. 📖 p.117-120"},
   es:{q:"Bajo HAZCOM, si detectas un riesgo en tu sitio de trabajo, debes ________.",opts:["reportarlo a tu supervisor","irte de inmediato","notificar a tus compañeros","corregir el problema"],c:0,exp:"Reportarlo a tu supervisor. HAZCOM le da a cada trabajador el derecho (y la responsabilidad) de señalar riesgos de inmediato en lugar de trabajar a su alrededor. 📖 pág. 117-120"}},
  {en:{q:"Which of the following must be reported to your supervisor?",opts:["Only major injuries","Only incidents and major injuries","All injuries, incidents, and accidents","Only incidents in which a death occurred"],c:2,exp:"All injuries, incidents, and accidents — even minor ones, since patterns in near-misses and small incidents often predict serious injuries down the line. 📖 p.117-120"},
   es:{q:"¿Cuál de los siguientes se debe reportar a tu supervisor?",opts:["Solo lesiones mayores","Solo incidentes y lesiones mayores","Todas las lesiones, incidentes y accidentes","Solo incidentes donde ocurrió una muerte"],c:2,exp:"Todas las lesiones, incidentes y accidentes, incluso los menores, ya que los patrones en los cuasi accidentes y pequeños incidentes suelen predecir lesiones graves más adelante. 📖 pág. 117-120"}},
  {en:{q:"Metal ladders should NOT be used near ________.",opts:["stairways","scaffolds","electrical equipment","windows"],c:2,exp:"Electrical equipment — metal ladders conduct electricity, so using one near power lines or exposed wiring risks electrocution. 📖 p.117-120"},
   es:{q:"Las escaleras metálicas NO deben usarse cerca de ________.",opts:["escaleras (stairways)","andamios","equipo eléctrico","ventanas"],c:2,exp:"Equipo eléctrico. Las escaleras metálicas conducen electricidad, así que usarlas cerca de líneas eléctricas o cableado expuesto arriesga una electrocución. 📖 pág. 117-120"}},
  {en:{q:"If you lean a straight ladder against the top of a 16-foot (4.9 m) wall, the base of the ladder should be ________.",opts:["3 feet (0.9 m) from the base of the wall","4 feet (1.2 m) from the base of the wall","5 feet (1.5 m) from the base of the wall","6 feet (1.8 m) from the base of the wall"],c:1,exp:"4 feet (1.2 m) from the base of the wall — the 4-to-1 ratio means the base sits out one-fourth the distance to where the ladder touches the structure. 📖 p.117-120"},
   es:{q:"Si apoyas una escalera recta contra la parte superior de una pared de 16 pies (4.9 m), la base de la escalera debe estar ________.",opts:["3 pies (0.9 m) de la base de la pared","4 pies (1.2 m) de la base de la pared","5 pies (1.5 m) de la base de la pared","6 pies (1.8 m) de la base de la pared"],c:1,exp:"4 pies (1.2 m) de la base de la pared: la proporción 4 a 1 significa que la base se coloca a un cuarto de la distancia hasta donde la escalera toca la estructura. 📖 pág. 117-120"}},
  {en:{q:"The two basic types of scaffolds are ________.",opts:["self-supporting and suspended scaffolds","fixed and portable scaffolds","metal and wooden scaffolds","assembled and deliverable scaffolds"],c:0,exp:"Self-supporting and suspended scaffolds — self-supporting scaffolds stand on their own frame, while suspended scaffolds hang from ropes or cables above. 📖 p.117-120"},
   es:{q:"Los dos tipos básicos de andamios son ________.",opts:["autoportantes y suspendidos","fijos y portátiles","metálicos y de madera","ensamblados y entregables"],c:0,exp:"Andamios autoportantes y suspendidos. Los autoportantes se sostienen sobre su propia estructura, mientras que los suspendidos cuelgan de cuerdas o cables desde arriba. 📖 pág. 117-120"}},
  {en:{q:"Interlocking stacked material is done by ________.",opts:["applying a chain and padlock to it","driving stakes around the stack","securing the objects with rope","placing the objects at right angles"],c:3,exp:"Placing the objects at right angles — alternating layers this way keeps a stack of material stable and much less likely to topple. 📖 p.117-120"},
   es:{q:"El intercalado de material apilado se hace ________.",opts:["aplicándole una cadena y candado","clavando estacas alrededor de la pila","asegurando los objetos con cuerda","colocando los objetos en ángulos rectos"],c:3,exp:"Colocando los objetos en ángulos rectos. Alternar las capas de esta forma mantiene estable una pila de material y reduce mucho el riesgo de que se caiga. 📖 pág. 117-120"}},
  {en:{q:"To reduce the risk of workers being hurt or killed by falling materials, the maximum height-to-base ratio of a stack of materials should be ________.",opts:["2:1","4:1","8:1","10:1"],c:1,exp:"4:1 — a stack taller than four times its base width becomes unstable and much more likely to tip over onto someone. 📖 p.117-120"},
   es:{q:"Para reducir el riesgo de que los trabajadores resulten heridos o muertos por materiales que caen, la proporción máxima de altura a base de una pila de materiales debe ser ________.",opts:["2:1","4:1","8:1","10:1"],c:1,exp:"4:1. Una pila más alta que cuatro veces el ancho de su base se vuelve inestable y es mucho más probable que se vuelque sobre alguien. 📖 pág. 117-120"}},
  {en:{q:"The most common cause of death for equipment operators is ________.",opts:["hit and run","equipment rollover","brake malfunction","head-on collisions"],c:1,exp:"Equipment rollover — heavy machinery like excavators and loaders can tip on uneven ground or steep slopes, making rollover the leading cause of death for operators. 📖 p.117-120"},
   es:{q:"La causa más común de muerte para los operadores de equipo es ________.",opts:["atropello y fuga","volcamiento del equipo","falla de frenos","colisiones frontales"],c:1,exp:"Volcamiento del equipo. La maquinaria pesada como excavadoras y cargadoras puede volcarse en terreno irregular o pendientes pronunciadas, lo que hace del volcamiento la principal causa de muerte para los operadores. 📖 pág. 117-120"}},
  {en:{q:"Most cave-ins happen suddenly with little or no warning and occur in trenches 5 feet (1.5 m) to ________.",opts:["10 feet (3.05 m) deep","15 feet (4.6 m) deep","20 feet (6.1 m) deep","25 feet (7.6 m) deep"],c:1,exp:"15 feet (4.6 m) deep — most trench cave-ins happen in this 5-to-15-foot range, and can occur suddenly with almost no warning. 📖 p.117-120"},
   es:{q:"La mayoría de los derrumbes ocurren de repente con poco o ningún aviso y suceden en zanjas de 5 pies (1.5 m) a ________.",opts:["10 pies (3.05 m) de profundidad","15 pies (4.6 m) de profundidad","20 pies (6.1 m) de profundidad","25 pies (7.6 m) de profundidad"],c:1,exp:"15 pies (4.6 m) de profundidad. La mayoría de los derrumbes de zanjas ocurren en este rango de 5 a 15 pies, y pueden suceder de repente con casi ningún aviso. 📖 pág. 117-120"}},
  {en:{q:"In every trench over 4 feet (1.2 m) deep, there must be an exit every ________.",opts:["10 feet (3.05 m)","12 feet (3.7 m)","18 feet (5.5 m)","25 feet (7.6 m)"],c:3,exp:"25 feet (7.6 m) — any trench deeper than 4 feet needs an exit (ladder, ramp, or steps) within 25 feet of every worker, so no one has far to go in an emergency. 📖 p.117-120"},
   es:{q:"En cada zanja de más de 4 pies (1.2 m) de profundidad, debe haber una salida cada ________.",opts:["10 pies (3.05 m)","12 pies (3.7 m)","18 pies (5.5 m)","25 pies (7.6 m)"],c:3,exp:"25 pies (7.6 m). Cualquier zanja de más de 4 pies necesita una salida (escalera, rampa o escalones) a menos de 25 pies de cada trabajador, para que nadie tenga que recorrer mucho en una emergencia. 📖 pág. 117-120"}},
  {en:{q:"The minimum distance that a spoil pile must be located from the edge of an excavation is ________.",opts:["6 inches (15 cm)","2 feet (0.6 m)","5 feet (1.5 m)","100 yards (91.4 m)"],c:1,exp:"2 feet (0.6 m) — keeping excavated material this far back prevents it from rolling back into the trench or overloading and collapsing the walls. 📖 p.117-120"},
   es:{q:"La distancia mínima a la que debe ubicarse una pila de material excavado (spoil) del borde de una excavación es ________.",opts:["6 pulgadas (15 cm)","2 pies (0.6 m)","5 pies (1.5 m)","100 yardas (91.4 m)"],c:1,exp:"2 pies (0.6 m). Mantener el material excavado a esta distancia evita que ruede de nuevo a la zanja o que sobrecargue y colapse las paredes. 📖 pág. 117-120"}},
  {en:{q:"The type of trench protection designed to prevent trench wall cave-ins is ________.",opts:["a trench shield","a trench box","a spoil pile","shoring"],c:3,exp:"Shoring — it actually supports the trench walls to prevent a cave-in, whereas a shield/box protects workers inside it during one. 📖 p.117-120"},
   es:{q:"El tipo de protección de zanja diseñada para prevenir derrumbes de las paredes de la zanja es ________.",opts:["un escudo de zanja","una caja de zanja","una pila de material excavado","el apuntalamiento (shoring)"],c:3,exp:"El apuntalamiento (shoring): en realidad sostiene las paredes de la zanja para prevenir un derrumbe, mientras que un escudo/caja protege a los trabajadores dentro durante uno. 📖 pág. 117-120"}},
  {en:{q:"Protective guards are provided on power tools and machines in order to keep ________.",opts:["dirt out of the tool or machine","workers from being caught in rotating or moving parts","the tool or machine from being struck by moving equipment","unauthorized personnel from using the tool or machine"],c:1,exp:"Workers from being caught in rotating or moving parts — guards form a physical barrier between a person and the tool's moving components, without stopping normal use. 📖 p.117-120"},
   es:{q:"Se colocan protectores en las herramientas y máquinas eléctricas para evitar que ________.",opts:["entre suciedad a la herramienta o máquina","los trabajadores queden atrapados en partes giratorias o móviles","la herramienta o máquina sea golpeada por equipo en movimiento","personal no autorizado use la herramienta o máquina"],c:1,exp:"Los trabajadores queden atrapados en partes giratorias o móviles. Los protectores forman una barrera física entre una persona y las partes móviles de la herramienta, sin impedir su uso normal. 📖 pág. 117-120"}},
  {en:{q:"The minimum safe working distance from exposed electrical conductors ________.",opts:["depends on the voltage","is 6 inches (15 cm)","is 1 foot (30 cm)","is unlimited"],c:0,exp:"Depends on the voltage — higher voltage requires a greater safe distance; 10 feet (3 m) is the minimum for conductors carrying 50,000 volts or less. 📖 p.117-120"},
   es:{q:"La distancia mínima de trabajo segura desde conductores eléctricos expuestos ________.",opts:["depende del voltaje","es de 6 pulgadas (15 cm)","es de 1 pie (30 cm)","es ilimitada"],c:0,exp:"Depende del voltaje. A mayor voltaje, mayor distancia de trabajo segura; 10 pies (3 m) es el mínimo para conductores de 50,000 voltios o menos. 📖 pág. 117-120"}},
  {en:{q:"Work that is performed near a hazard but not in direct contact with it is called ________.",opts:["close-call work","near-miss work","proximity work","barricade work"],c:2,exp:"Proximity work — working near a hazard without touching it directly still carries risk, which is why precautions apply even without direct contact. 📖 p.117-120"},
   es:{q:"El trabajo que se realiza cerca de un riesgo pero sin contacto directo con él se llama ________.",opts:["trabajo de cuasi accidente","trabajo casi fallido","trabajo de proximidad","trabajo de barricada"],c:2,exp:"Trabajo de proximidad. Trabajar cerca de un riesgo sin tocarlo directamente sigue implicando peligro, por eso se aplican precauciones incluso sin contacto directo. 📖 pág. 117-120"}},
  {en:{q:"Circuit breakers and disconnect switches are examples of ________.",opts:["energy-isolating devices","energy-removal devices","lockout/tagout devices","multiple lockout devices"],c:0,exp:"Energy-isolating devices — they physically cut off a piece of equipment's power source so it can be locked out safely. 📖 p.117-120"},
   es:{q:"Los disyuntores e interruptores de desconexión son ejemplos de ________.",opts:["dispositivos aislantes de energía","dispositivos de remoción de energía","dispositivos de bloqueo/etiquetado","dispositivos de bloqueo múltiple"],c:0,exp:"Dispositivos aislantes de energía. Cortan físicamente la fuente de energía de un equipo para poder bloquearlo con seguridad. 📖 pág. 117-120"}},
  {en:{q:"Which of the following provide the best eye protection from all directions?",opts:["Welding hoods","Face shields","Safety goggles","Strap-on glasses"],c:2,exp:"Safety goggles — they seal around the eyes and protect from all directions, unlike a face shield alone, which is worn in addition to goggles, not instead of them. 📖 p.117-120"},
   es:{q:"¿Cuál de los siguientes ofrece la mejor protección ocular desde todas las direcciones?",opts:["Careta de soldar","Protectores faciales","Gafas protectoras (goggles)","Gafas con correa"],c:2,exp:"Gafas protectoras (goggles). Sellan alrededor de los ojos y protegen desde todas las direcciones, a diferencia de un protector facial solo, que se usa además de las gafas, no en su lugar. 📖 pág. 117-120"}},
  {en:{q:"The type of respirator that has its own clean air supply is the ________.",opts:["half mask","mouthpiece with mechanical filter","self-contained breathing apparatus","full facepiece mask"],c:2,exp:"Self-contained breathing apparatus (SCBA) — it carries its own compressed air tank, unlike a supplied air mask, which pulls air from a remote compressor or tank. 📖 p.117-120"},
   es:{q:"El tipo de respirador que tiene su propio suministro de aire limpio es el ________.",opts:["media máscara","boquilla con filtro mecánico","aparato de respiración autónomo","máscara de careta completa"],c:2,exp:"Aparato de respiración autónomo (SCBA). Lleva su propio tanque de aire comprimido, a diferencia de la máscara de aire suministrado, que toma aire de un compresor o tanque remoto. 📖 pág. 117-120"}},
  {en:{q:"A worker can be exposed to hazardous materials by inhalation, ingestion, and ________.",opts:["osmosis","absorption","radiation","proximity"],c:1,exp:"Absorption — skin contact is the third route hazardous materials can enter the body, alongside inhalation (breathing) and ingestion (eating/drinking). 📖 p.117-120"},
   es:{q:"Un trabajador puede exponerse a materiales peligrosos por inhalación, ingestión y ________.",opts:["ósmosis","absorción","radiación","proximidad"],c:1,exp:"Absorción. El contacto con la piel es la tercera vía por la que los materiales peligrosos pueden entrar al cuerpo, junto con la inhalación (respirar) y la ingestión (comer/beber). 📖 pág. 117-120"}},
  {en:{q:"Hypothermia is a condition brought on by ________.",opts:["excessive alcohol consumption","prolonged exposure to cold","excessive sweating","prolonged exposure to heat"],c:1,exp:"Prolonged exposure to cold — hypothermia is a dangerous drop in body temperature that can happen gradually and go unnoticed until it's serious, even without freezing air. 📖 p.117-120"},
   es:{q:"La hipotermia es una condición causada por ________.",opts:["consumo excesivo de alcohol","exposición prolongada al frío","sudoración excesiva","exposición prolongada al calor"],c:1,exp:"Exposición prolongada al frío. La hipotermia es una caída peligrosa de la temperatura corporal que puede ocurrir gradualmente y pasar desapercibida hasta volverse grave, incluso sin aire bajo cero. 📖 pág. 117-120"}},
  {en:{q:"When in storage, oxygen and fuel cylinders used in oxyfuel cutting must be separated by ________.",opts:["20 feet (6.1 m)","a metal barrier","a 20-foot (6.1 m) wall","10 feet (3.05 m)"],c:0,exp:"20 feet (6.1 m), or by a 5-foot (1.5 m) high barrier with at least a half-hour fire rating — either option keeps a fuel-gas fire from reaching the oxygen supply. 📖 p.117-120"},
   es:{q:"En almacenamiento, los cilindros de oxígeno y combustible usados en corte oxicombustible deben separarse por ________.",opts:["20 pies (6.1 m)","una barrera metálica","una pared de 20 pies (6.1 m)","10 pies (3.05 m)"],c:0,exp:"20 pies (6.1 m), o mediante una barrera de 5 pies (1.5 m) de alto con clasificación contra incendio de al menos media hora; cualquiera de las dos evita que un incendio de gas combustible llegue al suministro de oxígeno. 📖 pág. 117-120"}},
  {en:{q:"Grease and oil must be kept away from oxygen tanks because ________.",opts:["grease or oil will contaminate the oxygen","oxygen causes oil to freeze","grease or oil can cause oxygen to explode","oxygen will contaminate the oil or grease"],c:2,exp:"Grease or oil can cause oxygen to explode — compressed oxygen reacts violently with petroleum-based products, so tanks and fittings must be kept completely free of them. 📖 p.117-120"},
   es:{q:"La grasa y el aceite deben mantenerse alejados de los tanques de oxígeno porque ________.",opts:["la grasa o el aceite contaminarán el oxígeno","el oxígeno hace que el aceite se congele","la grasa o el aceite pueden hacer que el oxígeno explote","el oxígeno contaminará el aceite o la grasa"],c:2,exp:"La grasa o el aceite pueden hacer que el oxígeno explote. El oxígeno comprimido reacciona violentamente con productos derivados del petróleo, así que los tanques y conexiones deben mantenerse completamente libres de ellos. 📖 pág. 117-120"}},
  {en:{q:"Which of these must be present in the same place at the same time for a fire to occur?",opts:["Oxygen, carbon dioxide, and heat","Oxygen, heat, and fuel","Hydrogen, oxygen, and wood","Grease, liquid, and heat"],c:1,exp:"Oxygen, heat, and fuel — known as the fire triangle. Remove any one of the three and a fire can't start, or an existing one will go out. 📖 p.117-120"},
   es:{q:"¿Cuáles de estos deben estar presentes en el mismo lugar al mismo tiempo para que ocurra un incendio?",opts:["Oxígeno, dióxido de carbono y calor","Oxígeno, calor y combustible","Hidrógeno, oxígeno y madera","Grasa, líquido y calor"],c:1,exp:"Oxígeno, calor y combustible: conocido como el triángulo del fuego. Elimina cualquiera de los tres y un incendio no puede comenzar, o uno existente se apagará. 📖 pág. 117-120"}},
  {en:{q:"A fire extinguisher labeled C would be used to fight a(n) ________.",opts:["electrical fire","magnesium fire","paper fire","gasoline fire"],c:0,exp:"Electrical fire — Class C extinguishers use a non-conductive agent that's safe on energized equipment. (Class A is ordinary combustibles, B is flammable liquids, D is combustible metals.) 📖 p.117-120"},
   es:{q:"Un extintor etiquetado con la letra C se usaría para combatir un(a) ________.",opts:["incendio eléctrico","incendio de magnesio","incendio de papel","incendio de gasolina"],c:0,exp:"Incendio eléctrico. Los extintores Clase C usan un agente no conductor, seguro para equipo energizado. (La Clase A es combustibles ordinarios, B líquidos inflamables, D metales combustibles.) 📖 pág. 117-120"}},
  {en:{q:"Which of the following characteristics is typical of a confined space?",opts:["It has a limited amount of ventilation.","There is no means of escape.","It is too small to work in.","It may be entered by untrained employees."],c:0,exp:"It has a limited amount of ventilation — along with being large enough to enter and work in, and having restricted entry/exit, poor ventilation is a defining trait of a confined space. 📖 p.117-120"},
   es:{q:"¿Cuál de las siguientes características es típica de un espacio confinado?",opts:["Tiene una cantidad limitada de ventilación.","No tiene medio de escape.","Es demasiado pequeño para trabajar en él.","Puede ser ingresado por empleados sin capacitación."],c:0,exp:"Tiene una cantidad limitada de ventilación. Junto con ser lo suficientemente grande para entrar y trabajar en él, y tener entrada/salida restringida, la mala ventilación es un rasgo definitorio de un espacio confinado. 📖 pág. 117-120"}}
];

const M2_CARDS = [
  {en:{q:"What are the 'fatal four' causes of construction deaths, in order of frequency?",a:"Falls (33.5%), Struck-by (11.1%), Electrical (8.5%), Caught-in/between (5.5%). Together they cause nearly 3 out of 5 construction deaths."}, es:{q:"¿Cuáles son las 'cuatro fatales' causas de muerte en construcción, en orden de frecuencia?",a:"Caídas (33.5%), Golpeado por objeto (11.1%), Eléctrico (8.5%), Atrapado en/entre (5.5%). Juntas causan casi 3 de cada 5 muertes en construcción."}},
  {en:{q:"Define incident vs. accident (per OSHA, as used in this module).",a:"Incident: unplanned event that may or may not cause property damage, but no injury. Accident: unplanned event causing personal injury and/or property damage."}, es:{q:"Define incidente vs. accidente (según OSHA, usado en este módulo).",a:"Incidente: evento no planeado que puede o no causar daño a la propiedad, pero sin lesión. Accidente: evento no planeado que causa lesión personal y/o daño a la propiedad."}},
  {en:{q:"What's the difference between a warning barricade and a protective barricade?",a:"Warning barricades (tape/rope) alert to hazards but give NO real protection. Protective barricades (posts/rails/chain/cable) give both a visual warning AND actual protection from injury."}, es:{q:"¿Cuál es la diferencia entre una barricada de advertencia y una barricada protectora?",a:"Las de advertencia (cinta/cuerda) alertan del riesgo pero no dan protección real. Las protectoras (postes/rieles/cadena/cable) dan advertencia visual Y protección real contra lesiones."}},
  {en:{q:"What are the three main parts of a personal fall arrest system (PFAS)?",a:"Anchor points, a body harness, and connecting devices (lanyards/lifelines)."}, es:{q:"¿Cuáles son las tres partes principales de un sistema personal de detención de caídas (PFAS)?",a:"Puntos de anclaje, un arnés de cuerpo entero y dispositivos de conexión (cuerdas/líneas de vida)."}},
  {en:{q:"What is the '4-to-1 ratio' for positioning a straight ladder?",a:"The base of the ladder should be set out 1 foot for every 4 feet of height to the point of contact (e.g., a 16-foot wall = 4-foot base offset)."}, es:{q:"¿Qué es la 'proporción 4 a 1' para colocar una escalera recta?",a:"La base de la escalera debe alejarse 1 pie por cada 4 pies de altura hasta el punto de contacto (ej. pared de 16 pies = base a 4 pies)."}},
  {en:{q:"Green, yellow, and red scaffold tags each mean what?",a:"Green: meets OSHA standards, safe to use. Yellow: doesn't fully meet standards, extra precautions needed. Red: being erected/dismantled — never use."}, es:{q:"¿Qué significan las etiquetas verde, amarilla y roja de un andamio?",a:"Verde: cumple estándares OSHA, seguro de usar. Amarilla: no cumple totalmente, se necesitan precauciones extra. Roja: en montaje/desmontaje, nunca usar."}},
  {en:{q:"What's the difference between shoring and shielding (trench boxes) in excavation work?",a:"Shoring supports the trench walls, helping prevent a cave-in from happening. Shielding (trench boxes) protects workers inside the box during a cave-in, but doesn't prevent the walls from collapsing."}, es:{q:"¿Cuál es la diferencia entre apuntalamiento (shoring) y blindaje (cajas de zanja) en excavaciones?",a:"El apuntalamiento sostiene las paredes de la zanja, ayudando a prevenir un derrumbe. El blindaje (cajas de zanja) protege a los trabajadores dentro de la caja durante un derrumbe, pero no evita que las paredes colapsen."}},
  {en:{q:"What are the 'big four' energy sources most often released in caught-in/struck-by incidents involving equipment?",a:"Mechanical, pneumatic, hydraulic, electrical — plus chemical, thermal, radioactive, gravitational, and stored energy in general."}, es:{q:"¿Cuáles son las fuentes de energía que más se liberan en incidentes de atrapado/golpeado por objeto con equipo?",a:"Mecánica, neumática, hidráulica, eléctrica; además de química, térmica, radioactiva, gravitacional y energía almacenada en general."}},
  {en:{q:"What's the difference between lockout and tagout?",a:"Lockout: an energy-isolating device (like a breaker) is placed in the Off position and physically locked. Tagout: components are set to a safe position and a written warning tag is attached — used when a device can't be physically locked."}, es:{q:"¿Cuál es la diferencia entre bloqueo (lockout) y etiquetado (tagout)?",a:"Bloqueo: un dispositivo aislante de energía (como un disyuntor) se pone en apagado y se bloquea físicamente. Etiquetado: los componentes se ponen en posición segura y se coloca una etiqueta de advertencia escrita, usado cuando un dispositivo no puede bloquearse físicamente."}},
  {en:{q:"List the PPE items commonly worn by craftworkers on a job site.",a:"Hard hats, eye and face protection, gloves, foot and leg protection, hearing protection, respiratory protection, and high-visibility clothing."}, es:{q:"Enumera los artículos de EPP que usan comúnmente los trabajadores de la construcción.",a:"Cascos, protección ocular y facial, guantes, protección de pies y piernas, protección auditiva, protección respiratoria y ropa de alta visibilidad."}},
  {en:{q:"What is silicosis and what causes it?",a:"An incurable, sometimes fatal lung disease caused by inhaling crystalline silica dust — created when cutting, drilling, or grinding concrete, masonry, or rock."}, es:{q:"¿Qué es la silicosis y qué la causa?",a:"Una enfermedad pulmonar incurable, a veces mortal, causada por inhalar polvo de sílice cristalina; se genera al cortar, taladrar o pulir concreto, mampostería o roca."}},
  {en:{q:"Name the four general types of respirators.",a:"Self-contained breathing apparatus (SCBA), supplied air mask, full facepiece mask with chemical canister (gas mask), and half mask/mouthpiece with mechanical filter."}, es:{q:"Nombra los cuatro tipos generales de respiradores.",a:"Aparato de respiración autónomo (SCBA), máscara de aire suministrado, máscara de careta completa con cartucho químico (máscara de gas), y media máscara/boquilla con filtro mecánico."}},
  {en:{q:"What are the three routes by which a worker can be exposed to hazardous materials?",a:"Inhalation (breathing), ingestion (eating/drinking), and absorption (skin contact)."}, es:{q:"¿Cuáles son las tres vías por las que un trabajador puede exponerse a materiales peligrosos?",a:"Inhalación (respirar), ingestión (comer/beber) y absorción (contacto con la piel)."}},
  {en:{q:"What's the difference between heat exhaustion and heat stroke?",a:"Heat exhaustion: cool/pale/moist skin, heavy sweating, dizziness — get to shade, cool the person down. Heat stroke: life-threatening, sweating STOPS, hot/dry skin, mental confusion — call emergency services immediately."}, es:{q:"¿Cuál es la diferencia entre agotamiento por calor y golpe de calor?",a:"Agotamiento por calor: piel fría/pálida/húmeda, sudoración intensa, mareo; llevar a la sombra y enfriar. Golpe de calor: mortal, la sudoración SE DETIENE, piel caliente/seca, confusión mental; llamar a emergencias de inmediato."}},
  {en:{q:"What's the fire triangle, and how do you put out a fire using it?",a:"Fuel + heat + oxygen, all needed in the same place at the same time. Remove any ONE of the three (fuel, heat, or oxygen) and the fire goes out."}, es:{q:"¿Qué es el triángulo del fuego, y cómo se apaga un fuego usándolo?",a:"Combustible + calor + oxígeno, los tres necesarios en el mismo lugar al mismo tiempo. Elimina CUALQUIERA de los tres (combustible, calor u oxígeno) y el fuego se apaga."}},
  {en:{q:"What do the fire extinguisher classes A, B, C, and D each fight?",a:"A: ordinary combustibles (wood, paper, cloth). B: flammable liquids (oil, gasoline, grease). C: electrical equipment. D: combustible metals (magnesium, sodium, titanium)."}, es:{q:"¿Qué combate cada clase de extintor A, B, C y D?",a:"A: combustibles ordinarios (madera, papel, tela). B: líquidos inflamables (aceite, gasolina, grasa). C: equipo eléctrico. D: metales combustibles (magnesio, sodio, titanio)."}},
  {en:{q:"What does the PASS method stand for, for using a fire extinguisher?",a:"Pull the pin, Aim at the base of the fire, Squeeze the handle, Sweep side to side."}, es:{q:"¿Qué significa el método PASS para usar un extintor?",a:"Pull (Jalar) el pasador, Aim (Apuntar) a la base del fuego, Squeeze (Apretar) la palanca, Sweep (Barrer) de lado a lado."}},
  {en:{q:"What three OSHA criteria define a confined space?",a:"Large enough to bodily enter and work in; has limited or restricted means of entry/exit; is not designed for continuous employee occupancy."}, es:{q:"¿Qué tres criterios de OSHA definen un espacio confinado?",a:"Suficientemente grande para entrar y trabajar en él; tiene medios de entrada/salida limitados o restringidos; no está diseñado para ocupación continua de empleados."}},
  {en:{q:"What makes a confined space a 'permit-required' confined space?",a:"It has one or more added hazards: a hazardous atmosphere, material that could engulf an entrant, an internal shape that could trap/asphyxiate someone, or another serious safety/health hazard."}, es:{q:"¿Qué hace que un espacio confinado sea un espacio 'que requiere permiso'?",a:"Tiene uno o más riesgos adicionales: una atmósfera peligrosa, material que podría envolver a quien entra, una forma interna que podría atrapar/asfixiar a alguien, u otro riesgo grave de seguridad o salud."}},
  {en:{q:"What is a hot work permit, and what is a fire watch?",a:"A hot work permit is official authorization for work that may pose a fire hazard (welding, cutting). A fire watch is a dedicated person, other than the operator, who constantly scans for fires during and after hot work."}, es:{q:"¿Qué es un permiso de trabajo en caliente, y qué es una vigilancia de incendio?",a:"Un permiso de trabajo en caliente es autorización oficial para trabajo que puede causar riesgo de incendio (soldar, cortar). Una vigilancia de incendio es una persona dedicada, distinta del operador, que vigila constantemente por incendios durante y después del trabajo en caliente."}}

function missedKey(item){ return item && item.en ? (item.en.q || item.en.prompt) : null; }
function addMissed(item){

/* ---- quick review: random mixed pull from everything built so far ---- */
// Fisher-Yates shuffle — always returns a NEW array so the original question
// bank (shared, reused across quiz attempts) is never mutated in place.
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---- module dates + "add to calendar" (.ics) ---- */
const STUDY_TOOL_URL = 'https://lawrencetotimeh.com/nccer-core-study/';
// Parse a plain "YYYY-MM-DD" as LOCAL midnight (not UTC) so the displayed/compared
// date never shifts a day off in negative-UTC-offset timezones.
function parseISODate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatDisplayDate(iso){
  return parseISODate(iso).toLocaleDateString(lang==='es'?'es-ES':'en-US', {month:'short', day:'numeric', year:'numeric'});
}
function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = parseISODate(iso);
  return Math.round((target - today) / 86400000);
}
// ICS date format for an all-day VALUE=DATE event: YYYYMMDD, computed from the
// local-midnight parse above (not toISOString, which can shift a day via UTC).
function icsDate(dateObj){
  const y=dateObj.getFullYear(), m=String(dateObj.getMonth()+1).padStart(2,'0'), d=String(dateObj.getDate()).padStart(2,'0');
  return `${y}${m}${d}`;
}
function icsDatePlusDays(iso, days){
  const d = parseISODate(iso); d.setDate(d.getDate()+days); return d;
}
function escapeICSText(s){
  return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
// Rough "how long will this take" estimate so a reminder can tell someone what
// they're actually signing up for, not just "go study." Not scientific — just
// (question count * a bit) + (flashcard count * a bit) + a flat orientation
// buffer, rounded to a friendly number. Returns null for not-yet-built modules
// (no sections/test/cards to count yet).
function estimateStudyMinutes(m){
  const sections = m.sections || [];
  const qCount = sections.reduce((sum,s)=> sum + (s.bank ? s.bank.length : 0), 0) + (m.moduleTest ? m.moduleTest.length : 0);
  const cardCount = m.cards ? m.cards.length : 0;
  if(qCount === 0 && cardCount === 0) return null;
  let mins = Math.round((qCount*1.2 + cardCount*0.5) / 5) * 5;
  mins += 15;
  return Math.max(20, mins);
}
// All-day event (module start / test day) — DTEND is the next day per the
// iCalendar spec for VALUE=DATE all-day events (end date is exclusive).
function icsEvent({summary, description, dateObj}){
  const dt = icsDate(dateObj);
  const endObj = new Date(dateObj); endObj.setDate(endObj.getDate()+1);
  const uid = `${dt}-${Math.random().toString(36).slice(2)}@nccer-core-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${icsDate(endObj)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT9H',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}
// Timed study-reminder event, at the person's chosen time of day, 45 minutes
// long. Deliberately "floating" local time (no Z / TZID) so whatever device
// this gets opened on shows it at that clock time on that device — the
// simplest correct behavior for a personal study reminder.
function icsTimedEvent({summary, description, dateObj, timeStr, durationMinutes}){
  const [hh,mm] = timeStr.split(':').map(Number);
  const start = new Date(dateObj); start.setHours(hh, mm, 0, 0);
  const end = new Date(start); end.setMinutes(end.getMinutes() + (durationMinutes||45));
  const fmt = (d)=> `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const uid = `${fmt(start)}-${Math.random().toString(36).slice(2)}@nccer-core-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(start)}`,
    `DTEND:${fmt(end)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT15M',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}

/* ---- study time preferences (saved once, reused for every module) ---- */
const STUDY_PREF_KEY = 'nccer_study_prefs';
function getStudyPrefs(){
  try{ const raw = localStorage.getItem(STUDY_PREF_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveStudyPrefs(prefs){ localStorage.setItem(STUDY_PREF_KEY, JSON.stringify(prefs)); }
// Spaced (recommended): reminders 7, 3, and 1 day before the test — distributed
// practice beats one cram session for actually remembering the material.
// Single: one reminder 3 days out, for anyone who'd rather keep it simple.
const CADENCE_OFFSETS = { spaced:[-7,-3,-1], single:[-3] };

// Builds one .ics file per module: the module's start date (all-day), one or
// more timed study reminders leading up to the test (per the saved cadence
// preference, at the saved time of day), and the test day itself (all-day).
// Every description carries a link straight back to the study tool and the
// estimated time the module takes, so a reminder popping up on someone's phone
// tells them what they're actually signing up for, not just "go study."
function buildModuleICS(m, prefs){
  const events = [];
  const mins = estimateStudyMinutes(m);
  const minsNote = mins ? `\n${t('estStudyTime')(mins)}` : '';
  events.push(icsEvent({
    summary: t('icsStartSummary')(m.num),
    description: `${t('icsStartDesc')(m.title[lang])}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
    dateObj: parseISODate(m.startDate)
  }));
  if(m.examDate){
    const examDisplay = formatDisplayDate(m.examDate);
    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    const startMidnight = parseISODate(m.startDate);
    const offsets = CADENCE_OFFSETS[prefs.cadence] || CADENCE_OFFSETS.spaced;
    offsets.forEach(offset=>{
      const reminderDate = icsDatePlusDays(m.examDate, offset);
      // Skip reminders that would land before the module even starts, or in the past.
      if(reminderDate < startMidnight || reminderDate < todayMidnight) return;
      const summary = mins ? t('icsStudyReminderTitle')(m.num, mins) : t('icsStudySummary')(m.num);
      events.push(icsTimedEvent({
        summary,
        description: `${t('icsStudyDesc')(m.title[lang], examDisplay)}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
        dateObj: reminderDate,
        timeStr: prefs.time,
        durationMinutes: mins || 45
      }));
    });
    events.push(icsEvent({
      summary: t('icsExamSummary')(m.num),
      description: `${t('icsExamDesc')(m.title[lang])}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
      dateObj: parseISODate(m.examDate)
    }));
  }
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//NCCER Core Study Tool//EN',
    'CALSCALE:GREGORIAN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');
}
function triggerICSDownload(m, prefs){
  const ics = buildModuleICS(m, prefs);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `NCCER-Module-${m.num}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
// Entry point every "Add to calendar" button calls. First time ever: opens the
// one-time study-time/cadence picker, saves the answer, then downloads. Every
// time after that: prefs are already saved, so this goes straight to the
// download with zero extra clicks.
function downloadModuleICS(m){
  const prefs = getStudyPrefs();
  if(prefs){ triggerICSDownload(m, prefs); return; }
  openStudyPrefModal(()=> triggerICSDownload(m, getStudyPrefs()));
}
function buildQuickReviewBank(size){
  let pool = [];
  MODULES.forEach(m=>{
    if(m.comingSoon) return;
    m.sections.forEach(s=>{ pool = pool.concat(s.bank); });
    pool = pool.concat(m.moduleTest);
  });
  pool = shuffleArray(pool);
  return pool.slice(0, Math.min(size, pool.length));
}

/* ---- simple day streak ---- */
function todayStr(){ return new Date().toISOString().slice(0,10); }
let streakDates = JSON.parse(localStorage.getItem('nccer_streak') || '[]');
(function recordVisitToday(){
  const today = todayStr();
  if(!streakDates.includes(today)){ streakDates.push(today); localStorage.setItem('nccer_streak', JSON.stringify(streakDates)); }
})();
function currentStreak(){
  const set = new Set(streakDates);
  let streak = 0; let d = new Date();
  while(true){
    const key = d.toISOString().slice(0,10);
    if(set.has(key)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}

function isModuleFullyDone(i){
  const m = MODULES[i]; if(m.comingSoon) return false;
  const p = progress[m.id]; if(!p) return false;
  const secOk = m.sections.every(s => (p.sec[s.key]||0) >= 85);
  return secOk && p.testPassed;
}
function isCumulativePassed(i){ return cumulative['after_'+MODULES[i].id]?.passed === true; }
function isCumulativeAvailable(i){ return i>=1; }
// Open access: any module with real content is available immediately. The only
// thing gating a module now is whether it actually has content built yet
// (comingSoon) — no more "pass the last module first" requirement.
function isModuleUnlocked(i){
  return !MODULES[i].comingSoon;
}
function combinedTestBank(uptoIdx){
  let bank = [];
  for(let j=0;j<=uptoIdx;j++){ if(!MODULES[j].comingSoon) bank = bank.concat(MODULES[j].moduleTest); }
  return bank;

function statusBadge(i){
  const m = MODULES[i];
  if(m.comingSoon) return `<span class="badge coming">${t('comingSoon')}</span>`;
  if(!isModuleUnlocked(i)) return `<span class="badge locked">🔒 ${t('locked')}</span>`;
  if(isModuleFullyDone(i)) return `<span class="badge done">✓ ${t('completed')}</span>`;
  return `<span class="badge progress">${t('inProgress')}</span>`;

function renderModuleMap(panel){
  let html = '';
  const streak = currentStreak();
  if(streak>=1) html += `<div class="streak-line">${t('streakLine')(streak)}</div>`;
  if(lastModIdx!==null && MODULES[lastModIdx] && !MODULES[lastModIdx].comingSoon){

  }

    html += `<div class="quick-card" id="quickReviewCard">
      <div><div class="qc-title">${t('quickReviewTitle')}</div><div class="qc-sub">${t('quickReviewSub')}</div></div>
    </div>`;
  }
  if(missed.length>0){

    </div>`;
  }
  html += `<p>${t('homeIntro')}</p><p class="hint">💡 ${t('glossaryHint')}</p>`;
  for(let i=0;i<MODULES.length;i++){
    const m = MODULES[i];
    const unlocked = isModuleUnlocked(i);
    const clickable = unlocked && !m.comingSoon;
    let dateLine = '';
    if(m.startDate){
      const started = daysUntil(m.startDate) <= 0;
      dateLine += `📅 ${started? t('startedOn') : t('startsOn')} ${formatDisplayDate(m.startDate)}`;
      if(m.examDate){
        const dLeft = daysUntil(m.examDate);
        dateLine += ` &nbsp;·&nbsp; 📝 ${t('examOn')}: ${formatDisplayDate(m.examDate)}`;
        if(dLeft === 0) dateLine += ` — <strong>${t('examToday')}</strong>`;
        else if(dLeft > 0 && dLeft <= 14) dateLine += ` — <strong>${t('examInDays')(dLeft)}</strong>`;
      }
      const estMins = estimateStudyMinutes(m);
      if(estMins) dateLine += `<div class="study-minutes">${t('estStudyTime')(estMins)}</div>`;
    }
    html += `<div class="module-card ${clickable?'clickable':''} ${!unlocked?'locked':''}" data-idx="${i}">
      <div style="flex:1;">
        <div class="mc-title"><span class="mc-seq">${i+1}.</span> ${m.title[lang]}</div>

      </div>
    </div>`;
    if(i>=1 && !MODULES[i].comingSoon){
      const avail = isCumulativeAvailable(i);
      const passed = isCumulativePassed(i);
      const nextLocked = MODULES[i+1] && MODULES[i+1].comingSoon;
      if(avail || passed){
        // List is sorted by module number, not teaching order, so "Modules 1-N" would
        // misstate which modules are actually built into this cumulative test. List the
        // real (non-comingSoon) module numbers included instead.
        const builtNums = MODULES.slice(0, i+1).filter(x=>!x.comingSoon).map(x=>x.num).join(' + ');
