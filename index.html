<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCCER Core Study Tool</title>
<style>
  :root{
    --bg:#0f1720; --panel:#ffffff; --accent:#2563eb; --accent2:#1d4ed8;
    --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626;
    --border:#e5e7eb; --amber:#d97706;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f1720,#1e293b); min-height:100vh; color:var(--text);
    display:flex; flex-direction:column; align-items:center; padding:20px 14px 60px;
  }
  .topbar{ width:100%; max-width:640px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1{ color:#fff; font-size:1.25rem; margin:0; }
  .lang-toggle{ display:flex; gap:6px; }
  .lang-toggle button{ padding:6px 12px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.8rem; }
  .lang-toggle button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .subtitle{ color:#94a3b8; font-size:0.85rem; margin-bottom:16px; text-align:center; max-width:640px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; max-width:640px; }
  .tab-btn{ padding:9px 14px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.82rem; }
  .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .panel{ width:100%; max-width:640px; background:var(--panel); border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .hint{ font-size:0.78rem; color:var(--muted); margin-bottom:10px; }
  .breadcrumb{ font-size:0.85rem; color:var(--accent2); cursor:pointer; margin-bottom:12px; display:inline-block; }
  .module-card{ border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .module-card.clickable{ cursor:pointer; }
  .module-card.clickable:hover{ border-color:var(--accent); }
  .module-card.locked{ opacity:0.55; }
  .module-card .mc-title{ font-weight:600; font-size:0.95rem; }
  .module-card .mc-sub{ font-size:0.75rem; color:var(--muted); margin-top:2px; }
  .badge{ font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.locked{ background:#f1f5f9; color:var(--muted); }
  .badge.progress{ background:#fef3c7; color:var(--amber); }
  .badge.done{ background:#dcfce7; color:var(--green); }
  .badge.coming{ background:#e0e7ff; color:#4338ca; }
  .cum-card{ border:2px dashed #93c5fd; border-radius:12px; padding:14px 16px; margin:4px 0 14px; background:#eff6ff; }
  .score-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .score-card{ border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .score-card .pct{ font-size:1.3rem; font-weight:700; }
  .score-card .lbl{ font-size:0.72rem; color:var(--muted); margin-top:2px;}
  .pass{ color:var(--green); } .fail{ color:var(--red); } .pending{ color:var(--muted); }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-size:0.9rem; cursor:pointer; width:100%; }
  button.primary:hover{ background:var(--accent2); }
  button.small{ width:auto; padding:8px 14px; font-size:0.82rem; }
  button.option{ display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.9rem; }
  button.option:hover{ border-color:var(--accent); }
  button.option.correct{ background:#bbf7d0; border:2px solid #15803d; color:#14532d; font-weight:700; }
  button.option.incorrect{ background:#fecaca; border:2px solid #b91c1c; color:#7f1d1d; font-weight:700; }
  button.option.selected{ background:#dbeafe; border:2px solid var(--accent); }
  .review-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; text-align:left; }
  .review-item .rq{ font-weight:600; font-size:0.88rem; margin-bottom:6px; }
  .review-item .ra{ font-size:0.84rem; margin-bottom:3px; }
  .review-item .ra.wrong{ color:#b91c1c; }
  .review-item .ra.right{ color:#15803d; }
  .review-item .rexp{ font-size:0.82rem; color:var(--muted); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }
  .q-count{ font-size:0.78rem; color:var(--muted); margin-bottom:6px; }
  .q-text{ font-size:1.02rem; font-weight:600; margin-bottom:12px; }
  .explain{ margin-top:12px; padding:12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; font-size:0.86rem; display:none; }
  .explain.show{ display:block; }
  .result-big{ text-align:center; padding:16px 0; }
  .result-pct{ font-size:2.2rem; font-weight:800; }
  .result-msg{ font-size:0.92rem; color:var(--muted); margin-top:6px; }
  .scene{ width:100%; height:290px; perspective:1400px; margin-bottom:16px; }
  .card{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .card.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center; }
  .front{ background:#fff; border:1px solid var(--border); }
  .back{ background:#eff6ff; border:1px solid #bfdbfe; transform:rotateY(180deg); }
  .tag{ position:absolute; top:12px; left:14px; font-size:0.66rem; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .nav{ display:flex; gap:10px; justify-content:center; margin-top:4px; }
  .nav button{ font-size:0.82rem; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .tip-box{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; }
  .tip-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border); }
  .tip-row:first-of-type{ border-top:none; }
  select{ padding:6px 10px; border-radius:8px; border:1px solid var(--border); }
  footer{ color:#64748b; font-size:0.72rem; margin-top:18px; text-align:center; max-width:600px; }
  .glossary-term{ text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; color:var(--accent2); cursor:pointer; font-weight:600; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(15,23,32,0.65); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:#fff; border-radius:14px; padding:24px; max-width:380px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.35); }
  .modal-term{ font-weight:700; font-size:1.1rem; margin-bottom:8px; color:var(--accent2); }
  .modal-def{ font-size:0.92rem; color:var(--text); margin-bottom:16px; line-height:1.5; }
</style>

/* ============ GLOSSARY ============ */
const GLOSSARY = {
  craftProfessional:{en:{term:"craft professional",def:"A trained and skilled individual who designs and builds things, and conforms to the technical and ethical standards of their trade."},es:{term:"profesional del oficio",def:"Una persona capacitada y calificada que diseña y construye cosas, y cumple con los estándares técnicos y éticos de su oficio."}},

  infrastructure:{en:{term:"infrastructure",def:"The transportation, water, electrical, and telecommunications systems that allow communities and countries to operate."},es:{term:"infraestructura",def:"Los sistemas de transporte, agua, electricidad y telecomunicaciones que permiten que las comunidades y los países funcionen."}},
  ppe:{en:{term:"PPE",def:"Personal protective equipment — clothing or equipment designed to prevent or reduce injuries (hard hats, gloves, safety glasses, etc.)."},es:{term:"EPP",def:"Equipo de protección personal: ropa o equipo diseñado para prevenir o reducir lesiones."}},

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function annotate(text){
  const entries = Object.keys(GLOSSARY).map(k=>({key:k, pattern: GLOSSARY[k][lang].term}));
  entries.sort((a,b)=> b.pattern.length - a.pattern.length);
  const alternation = entries.map(e=> escapeRegExp(e.pattern)).join('|');
  const re = new RegExp('\\b(' + alternation + ')\\b', 'gi');
  return text.replace(re, (match)=>{
    const found = entries.find(e=> e.pattern.toLowerCase() === match.toLowerCase());
    return `<span class="glossary-term" data-term="${found?found.key:''}">${match}</span>`;
  });
}
function attachGlossaryHandlers(container){
  container.querySelectorAll('.glossary-term').forEach(el=>{
    el.addEventListener('click', function(e){ e.stopPropagation(); openGlossary(this.dataset.term); });
  });
}
function openGlossary(key){
  const g = GLOSSARY[key]; if(!g) return;
  document.getElementById('glossTermText').textContent = g[lang].term;
  document.getElementById('glossDefText').textContent = g[lang].def;
  document.getElementById('glossaryOverlay').style.display = 'flex';
}
function closeGlossary(){ document.getElementById('glossaryOverlay').style.display='none'; }

/* ============ READ ALOUD (TEXT-TO-SPEECH) ============ */
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(stripHtml(text));
  utter.lang = lang==='es' ? 'es-ES' : 'en-US';
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
}
function stopSpeaking(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

/* ============ STATE ============ */
let lang = localStorage.getItem('nccer_lang') || 'en';
let progress = JSON.parse(localStorage.getItem('nccer_progress') || '{}');
let cumulative = JSON.parse(localStorage.getItem('nccer_cumulative') || '{}');
let topTab = 'home';
let homeView = null; // null = module map, {modIdx} = module detail
let quizState = null;
let cardState = { modIdx:0, order:[], idx:0 };

function saveProgress(){ localStorage.setItem('nccer_progress', JSON.stringify(progress)); }
function saveCumulative(){ localStorage.setItem('nccer_cumulative', JSON.stringify(cumulative)); }
function ensureProgress(modId){
  if(!progress[modId]) progress[modId] = { sec:{}, testScore:0, testPassed:false };
  return progress[modId];
}
function t(key){ return T[lang][key]; }

function isModuleFullyDone(i){
  const m = MODULES[i]; if(m.comingSoon) return false;
  const p = progress[m.id]; if(!p) return false;
  const secOk = m.sections.every(s => (p.sec[s.key]||0) >= 85);
  return secOk && p.testPassed;
}
function isCumulativePassed(i){ return cumulative['after_'+MODULES[i].id]?.passed === true; }
function isCumulativeAvailable(i){ return i>=1 && isModuleFullyDone(i); }
function isModuleUnlocked(i){
  if(i===0) return true;
  if(MODULES[i].comingSoon && !MODULES[i-1] ) return false;
  if(i===1) return progress['m1']?.testPassed === true;
  return isCumulativePassed(i-1);
}
function combinedTestBank(uptoIdx){
  let bank = [];
  for(let j=0;j<=uptoIdx;j++){ if(!MODULES[j].comingSoon) bank = bank.concat(MODULES[j].moduleTest); }
  return bank;
}

function setLang(l){
  lang = l; localStorage.setItem('nccer_lang', l);
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnES').classList.toggle('active', l==='es');
  document.getElementById('subtitle').textContent = t('subtitle');
  document.getElementById('footerNote').textContent = t('footer');
  document.getElementById('glossCloseBtn').textContent = t('close');
  renderTopTabs(); renderPanel();
}

function renderTopTabs(){
  const wrap = document.getElementById('topTabs');
  const items = [ {key:'home', label:t('tabHome')}, {key:'cards', label:t('tabCards')}, {key:'support', label:t('tabSupport')} ];
  wrap.innerHTML = '';
  items.forEach(it=>{
    const b = document.createElement('button');
    b.className = 'tab-btn' + (topTab===it.key?' active':'');
    b.textContent = it.label;
    b.onclick = ()=>{ topTab = it.key; homeView=null; quizState=null; renderTopTabs(); renderPanel(); };
    wrap.appendChild(b);
  });
}

function renderPanel(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  if(topTab==='home'){
    if(homeView===null) renderModuleMap(panel);
    else renderModuleDetail(panel, homeView.modIdx);
    return;
  }
  if(topTab==='cards'){ renderCards(panel); return; }
  if(topTab==='support'){ renderSupport(panel); return; }
}

function statusBadge(i){
  const m = MODULES[i];
  if(m.comingSoon) return `<span class="badge coming">${t('comingSoon')}</span>`;
  if(!isModuleUnlocked(i)) return `<span class="badge locked">🔒 ${t('locked')}</span>`;
  if(isModuleFullyDone(i)) return `<span class="badge done">✓ ${t('completed')}</span>`;
  return `<span class="badge progress">${t('inProgress')}</span>`;
}

function renderModuleMap(panel){
  let html = `<p>${t('homeIntro')}</p><p class="hint">💡 ${t('glossaryHint')}</p>`;
  for(let i=0;i<MODULES.length;i++){
    const m = MODULES[i];
    const unlocked = isModuleUnlocked(i);
    const clickable = unlocked && !m.comingSoon;
    html += `<div class="module-card ${clickable?'clickable':''} ${!unlocked?'locked':''}" data-idx="${i}">
      <div><div class="mc-title">${m.title[lang]}</div></div>
      ${statusBadge(i)}
    </div>`;
    if(i>=1 && !MODULES[i].comingSoon){
      const avail = isCumulativeAvailable(i);
      const passed = isCumulativePassed(i);
      const nextLocked = MODULES[i+1] && MODULES[i+1].comingSoon;
      if(avail || passed){
        html += `<div class="cum-card" data-cum="${i}">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><strong>${t('cumulativeLabel')}</strong><div class="hint" style="margin:2px 0 0;">Modules 1–${i+1}</div></div>
            ${passed ? `<span class="badge done">✓ ${t('completed')}</span>` : `<span class="badge progress">${t('inProgress')}</span>`}
          </div>
        </div>`;
      }
    }
  }
  panel.innerHTML = html;
  panel.querySelectorAll('.module-card.clickable').forEach(el=>{
    el.onclick = ()=>{ homeView = {modIdx: parseInt(el.dataset.idx)}; renderPanel(); };
  });
  panel.querySelectorAll('.cum-card').forEach(el=>{
    el.onclick = ()=>{
      const i = parseInt(el.dataset.cum);
      if(isCumulativePassed(i)) return;
      startCumulativeTest(i);
    };
  });
}

function renderModuleDetail(panel, i){
  const m = MODULES[i];
  const p = ensureProgress(m.id);
  let html = `<div class="breadcrumb" id="backToMap">${t('backToModules')}</div><h2>${m.title[lang]}</h2><div class="score-grid">`;
  m.sections.forEach(s=>{
    const sc = p.sec[s.key]||0;
    const cls = sc===0?'pending':(sc>=85?'pass':'fail');
    const label = sc===0? t('notStarted') : (sc>=85? t('passed') : t('tryAgainSection'));
    html += `<div class="score-card" data-sec="${s.key}" style="cursor:pointer;">
      <div class="pct ${cls}">${sc}%</div><div class="lbl">${s.label[lang]}</div><div class="lbl">${label}</div>
    </div>`;
  });
  html += `</div>`;
  const allSecOk = m.openTest || m.sections.every(s=> (p.sec[s.key]||0) >= 85);
  html += `<h3>${t('moduleTestLabel')} <span class="hint">(${t('passThreshold')})</span></h3>`;
  if(!allSecOk){
    html += `<p class="hint">🔒 ${t('moduleTestLockedMsg')}</p>`;
  } else {
    const testSc = p.testScore||0;
    const cls = testSc===0?'pending':(p.testPassed?'pass':'fail');
    const label = testSc===0? t('notStarted') : (p.testPassed? t('passed') : t('tryAgainTest'));
    html += `<div class="score-card" style="max-width:220px;margin-bottom:10px;"><div class="pct ${cls}">${testSc}%</div><div class="lbl">${label}</div></div>
      <button class="primary" id="startModTestBtn">${testSc>0? t('retakeBtn') : t('startTest')}</button>`;
  }
  panel.innerHTML = html;
  document.getElementById('backToMap').onclick = ()=>{ homeView=null; renderPanel(); };
  panel.querySelectorAll('.score-card[data-sec]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.sec;
      const section = m.sections.find(s=>s.key===key);
      startQuiz({kind:'section', modIdx:i, sectionKey:key, bank:section.bank, threshold:85});
    };
  });
  const testBtn = document.getElementById('startModTestBtn');
  if(testBtn) testBtn.onclick = ()=> startQuiz({kind:'moduleTest', modIdx:i, bank:m.moduleTest, threshold:70});
}

function startQuiz(cfg){
  quizState = { ...cfg, idx:0, correctCount:0, answered:false, selected:null, records:[] };
  renderQuizQuestion();
}
function startCumulativeTest(i){
  quizState = { kind:'cumulative', modIdx:i, bank: combinedTestBank(i), threshold:70, idx:0, correctCount:0, answered:false, selected:null, records:[] };
  renderQuizQuestion();
}

function showOptionDefinition(text){
  const entries = Object.keys(GLOSSARY).map(k=>({key:k, pattern: GLOSSARY[k][lang].term}));
  entries.sort((a,b)=> b.pattern.length - a.pattern.length);
  const found = entries.find(e=> new RegExp('\\b'+escapeRegExp(e.pattern)+'\\b','i').test(text));
  if(found){ openGlossary(found.key); return; }
  document.getElementById('glossTermText').textContent = '';
  document.getElementById('glossDefText').textContent = lang==='es' ? 'No hay una definición rápida para esta respuesta.' : 'No quick definition available for this answer.';
  document.getElementById('glossaryOverlay').style.display = 'flex';
}

function renderQuizQuestion(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  const item = quizState.bank[quizState.idx][lang];
  // The official module/cumulative test mimics a real exam: no auto-highlighted glossary
  // terms (a neutral "?" gives lookup on demand instead), you can change your pick before
  // submitting, and right/wrong isn't revealed until the full test is done.
  const isOfficialTest = (quizState.kind==='moduleTest' || quizState.kind==='cumulative');
  let optsHtml = '';
  item.opts.forEach((opt,idx)=>{
    if(isOfficialTest){
      const selCls = quizState.selected===idx ? ' selected' : '';
      optsHtml += `<button class="option${selCls}" data-i="${idx}">${opt} <span class="opt-def-btn" data-opt="${idx}" style="display:inline-block;margin-left:6px;padding:0 6px;border:1px solid currentColor;border-radius:50%;font-size:0.75rem;opacity:0.7;cursor:pointer;">?</span></button>`;
    } else {
      optsHtml += `<button class="option" data-i="${idx}">${annotate(opt)}</button>`;
    }
  });
  const officialNextLabel = quizState.idx+1===quizState.bank.length ? t('finishBtn') : t('nextBtn');
  panel.innerHTML = `
    <div class="q-count">${t('question')} ${quizState.idx+1} ${t('of')} ${quizState.bank.length}</div>
    <div class="q-text">${annotate(item.q)}</div>
    <button id="readAloudBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:4px 10px;font-size:0.78rem;margin-bottom:10px;cursor:pointer;">${t('readAloud')}</button>
    <div id="optsWrap">${optsHtml}</div>
    ${isOfficialTest ? '' : `<div class="explain" id="explainBox">${annotate(item.exp)}</div>`}
    <br>
    <button class="primary" id="nextBtn" style="${isOfficialTest ? (quizState.selected===null?'opacity:0.5;':'') : 'display:none;'}">${isOfficialTest ? officialNextLabel : (quizState.idx+1===quizState.bank.length ? t('finishBtn') : t('nextBtn'))}</button>
  `;
  attachGlossaryHandlers(panel);
  if(isOfficialTest){
    panel.querySelectorAll('.opt-def-btn').forEach(el=>{
      el.addEventListener('click', function(e){
        e.stopPropagation();
        const idx = parseInt(this.dataset.opt);
        showOptionDefinition(item.opts[idx]);
      });
    });
  }
  document.getElementById('readAloudBtn').onclick = ()=>{
    const optLabels = ['A','B','C','D'];
    const optsText = item.opts.map((o,idx)=> `${optLabels[idx]}. ${o}`).join('. ');
    speak(item.q + '. ' + optsText);
  };

  if(isOfficialTest){
    document.querySelectorAll('#optsWrap .option').forEach(btn=>{
      btn.onclick = ()=>{
        quizState.selected = parseInt(btn.dataset.i);
        renderQuizQuestion();
      };
    });
    document.getElementById('nextBtn').onclick = ()=>{
      if(quizState.selected===null) return;
      const chosen = quizState.selected; const correct = item.c;
      quizState.records.push({ q:item.q, opts:item.opts, chosen, correct, exp:item.exp, right: chosen===correct });
      if(chosen===correct) quizState.correctCount++;
      quizState.selected = null;
      if(quizState.idx+1 < quizState.bank.length){ quizState.idx++; renderQuizQuestion(); }
      else finishQuiz();
    };
    return;
  }

  document.querySelectorAll('#optsWrap .option').forEach(btn=>{
    btn.onclick = ()=>{
      if(quizState.answered) return;
      quizState.answered = true;
      const chosen = parseInt(btn.dataset.i); const correct = item.c;
      document.querySelectorAll('#optsWrap .option').forEach((b2,i2)=>{
        if(i2===correct) b2.classList.add('correct'); else if(i2===chosen) b2.classList.add('incorrect');
      });
      if(chosen===correct) quizState.correctCount++;
      document.getElementById('explainBox').classList.add('show');
      document.getElementById('nextBtn').style.display = 'block';
    };
  });
  document.getElementById('nextBtn').onclick = ()=>{
    if(quizState.idx+1 < quizState.bank.length){ quizState.idx++; quizState.answered=false; renderQuizQuestion(); }
    else finishQuiz();
  };
}

function finishQuiz(){
  stopSpeaking();
  const panel = document.getElementById('panel');
  const pct = Math.round((quizState.correctCount / quizState.bank.length) * 100);
  const threshold = quizState.threshold;
  const passed = pct >= threshold;
  if(quizState.kind==='section'){
    const p = ensureProgress(MODULES[quizState.modIdx].id);
    p.sec[quizState.sectionKey] = pct; saveProgress();
  } else if(quizState.kind==='moduleTest'){
    const p = ensureProgress(MODULES[quizState.modIdx].id);
    p.testScore = pct; p.testPassed = passed; saveProgress();
  } else if(quizState.kind==='cumulative'){
    cumulative['after_'+MODULES[quizState.modIdx].id] = {score:pct, passed}; saveCumulative();
  }
  const failMsg = quizState.kind==='section' ? t('failMsgSection') : t('failMsgTest');
  const passMsg = quizState.kind==='section' ? t('passMsgSection') : t('passMsgTest');
  const isOfficialTest = (quizState.kind==='moduleTest' || quizState.kind==='cumulative');
  let reviewHtml = '';
  if(isOfficialTest && quizState.records && quizState.records.length){
    reviewHtml = `<h3>${t('reviewLabel')}</h3>` + quizState.records.map((r,i)=>{
      const yourOpt = r.opts[r.chosen];
      const correctOpt = r.opts[r.correct];
      return `<div class="review-item">
        <div class="rq">${i+1}. ${annotate(r.q)}</div>
        <div class="ra ${r.right?'right':'wrong'}">${t('yourAnswer')}: ${yourOpt} ${r.right?'✓':'✗'}</div>
        ${r.right ? '' : `<div class="ra right">${t('correctAnswer')}: ${correctOpt}</div>`}
        <div class="rexp">${annotate(r.exp)}</div>
      </div>`;
    }).join('');
  }
  panel.innerHTML = `
    <div class="result-big">
      <div class="result-pct ${passed?'pass':'fail'}">${pct}%</div>
      <div class="result-msg">${t('yourScore')}: ${quizState.correctCount}/${quizState.bank.length}</div>
      <div class="result-msg">${passed ? passMsg : failMsg}</div>
    </div>
    <button class="primary" id="retakeQBtn">${t('retakeBtn')}</button><br><br>
    <button class="primary" id="backQBtn" style="background:#475569;">${t('backHome')}</button>
    ${reviewHtml ? `<br><br>${reviewHtml}` : ''}
  `;
  if(reviewHtml) attachGlossaryHandlers(panel);
  document.getElementById('retakeQBtn').onclick = ()=>{
    if(quizState.kind==='cumulative') startCumulativeTest(quizState.modIdx);
    else startQuiz(quizState);
  };
  document.getElementById('backQBtn').onclick = ()=>{
    if(quizState.kind==='cumulative'){ homeView=null; }
    quizState=null; renderPanel();
  };
}

function renderCards(panel){
  const unlockedModules = MODULES.map((m,i)=>({m,i})).filter(x=> !x.m.comingSoon && isModuleUnlocked(x.i));
  if(cardState.modIdx===null || !unlockedModules.find(x=>x.i===cardState.modIdx)) cardState.modIdx = unlockedModules[0]?.i ?? 0;
  const mod = MODULES[cardState.modIdx];
  const deck = mod.cards || [];
  if(cardState.idx >= deck.length) cardState.idx = 0;
  const card = deck[cardState.idx] ? deck[cardState.idx][lang] : {q:'',a:''};
  let options = unlockedModules.map(x=>`<option value="${x.i}" ${x.i===cardState.modIdx?'selected':''}>${x.m.title[lang]}</option>`).join('');
  panel.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <select id="modFilter">${options}</select>
      <button id="shuffleCardsBtn">${t('shuffleBtn')}</button>
    </div>
    <div style="text-align:center; font-size:0.8rem; color:var(--muted); margin-bottom:8px;">${deck.length? (cardState.idx+1)+' / '+deck.length : ''}</div>
    <div class="scene">
      <div class="card" id="flashCard">
        <div class="face front"><div class="tag">${lang==='en'?'Question':'Pregunta'}</div><div>${annotate(card.q||'')}</div><div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">${t('flipHint')}</div></div>
        <div class="face back"><div class="tag">${lang==='en'?'Answer':'Respuesta'}</div><div style="font-weight:500;font-size:0.95rem;">${annotate(card.a||'')}</div><div style="margin-top:10px;font-size:0.75rem;color:var(--muted);">${t('flipBackHint')}</div></div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:8px;">
      <button id="readAloudCardBtn" style="background:none;border:1px solid var(--accent2);color:var(--accent2);border-radius:6px;padding:4px 10px;font-size:0.78rem;cursor:pointer;">${t('readAloud')}</button>
    </div>
    <div class="nav">
      <button id="prevCardBtn">${t('prevBtn')}</button>
      <button id="flipCardBtn">${t('flipBtn')}</button>
      <button id="nextCardBtn2">${t('nextCardBtn')}</button>
    </div>
  `;
  attachGlossaryHandlers(panel);
  document.getElementById('readAloudCardBtn').onclick = ()=>{
    const showingBack = document.getElementById('flashCard').classList.contains('flipped');
    speak(showingBack ? (card.a||'') : (card.q||''));
  };
  document.getElementById('modFilter').onchange = (e)=>{ cardState.modIdx = parseInt(e.target.value); cardState.idx=0; renderCards(panel); };
  document.getElementById('flashCard').onclick = ()=> document.getElementById('flashCard').classList.toggle('flipped');
  document.getElementById('flipCardBtn').onclick = ()=> document.getElementById('flashCard').classList.toggle('flipped');
  document.getElementById('nextCardBtn2').onclick = ()=>{ if(deck.length){ cardState.idx=(cardState.idx+1)%deck.length; renderCards(panel);} };
  document.getElementById('prevCardBtn').onclick = ()=>{ if(deck.length){ cardState.idx=(cardState.idx-1+deck.length)%deck.length; renderCards(panel);} };
  document.getElementById('shuffleCardsBtn').onclick = ()=>{
    for(let a=deck.length-1;a>0;a--){ const b=Math.floor(Math.random()*(a+1)); [deck[a],deck[b]]=[deck[b],deck[a]]; }
    cardState.idx=0; renderCards(panel);
  };
}

function renderSupport(panel){
  panel.innerHTML = `
    <p>${t('supportIntro')}</p>
    <div class="tip-box">
      <h3>💛 ${lang==='en'?'Support the maker':'Apoya al creador'}</h3>
      <div class="tip-row"><span>${t('cashapp')}</span><span style="font-weight:700;">$AgentKodak</span></div>
      <div class="tip-row"><span>${t('zelle')}</span><span style="font-weight:700;">(571) 331-5770</span></div>
    </div>
  `;
}
