    <rect x="346" y="120" width="34" height="108" rx="8" fill="#dc2626"/>
    <rect x="357" y="106" width="12" height="16" fill="#334155"/>
    <path d="M 356 168 L 368 152 L 362 166 L 370 164 L 354 184 L 360 168 Z" fill="#ffffff"/>
    <!-- barrier wall with ? -->
