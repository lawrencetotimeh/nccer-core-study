    <rect x="150" y="120" width="34" height="108" rx="8" fill="#dc2626"/>
    <rect x="161" y="106" width="12" height="16" fill="#334155"/>
    <path d="M 160 168 L 172 152 L 166 166 L 174 164 L 158 184 L 164 168 Z" fill="#ffffff"/>
    <line x1="78" y1="96" x2="146" y2="96" stroke="#0f1720" stroke-width="2"/>
    <polygon points="86,91 74,96 86,101" fill="#0f1720"/>
    <polygon points="138,91 150,96 138,101" fill="#0f1720"/>
    <text x="112" y="86" text-anchor="middle" font-size="13" fill="#0f1720">20 ft</text>
