<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="ui-monospace, monospace">
  <rect width="400" height="260" fill="#ffffff"/>
  <!-- overhead beam anchor -->
  <rect x="80" y="20" width="240" height="16" fill="#334155"/>
  <circle cx="200" cy="48" r="9" fill="none" stroke="#0f1720" stroke-width="3.5"/>
  <text x="240" y="42" font-size="13" fill="#0f1720">1</text>
  <circle cx="246" cy="37" r="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- lanyard / connecting device -->
  <path d="M 200 57 Q 190 90 200 118" stroke="#2563eb" stroke-width="4" fill="none" stroke-dasharray="1 7" stroke-linecap="round"/>
  <text x="238" y="92" font-size="13" fill="#0f1720">2</text>
  <circle cx="244" cy="87" r="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- figure wearing ??? -->
  <g stroke="#0f1720" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="200" cy="138" r="12" fill="#ffffff"/>
    <line x1="200" y1="150" x2="200" y2="190"/>
    <line x1="200" y1="160" x2="180" y2="176"/>
    <line x1="200" y1="160" x2="220" y2="176"/>
    <line x1="200" y1="190" x2="186" y2="214"/>
    <line x1="200" y1="190" x2="214" y2="214"/>
  </g>
  <!-- question mark over the torso gear -->
  <rect x="184" y="152" width="32" height="44" rx="8" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="258" cy="172" r="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="258" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#dc2626">?</text>
  <text x="278" y="177" font-size="13" fill="#0f1720">3</text>
  <line x1="242" y1="172" x2="218" y2="172" stroke="#dc2626" stroke-width="1.5"/>
</svg>
